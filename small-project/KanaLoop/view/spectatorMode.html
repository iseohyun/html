<style>
  #spectator-game-layer {
    display: flex;
    flex-direction: column;
    height: 100%;
    box-sizing: border-box;
    padding: 10px;
  }
  .spectator-display {
    display: flex;
    flex: 1;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    margin-top: 20px;
    margin-bottom: 20px;
    position: relative;
    background: #fafafa;
    border-radius: 12px;
    border: 1px solid #eaeaea;
    box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.02);
  }
  #spectator-char {
    font-size: min(35vw, 160px);
    font-weight: bold;
    color: #212529;
    user-select: none;
  }
  .pulse-scale {
    animation: pulseScale 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }
  @keyframes pulseScale {
    0% {
      transform: scale(0.7);
      opacity: 0.2;
    }
    100% {
      transform: scale(1.0);
      opacity: 1;
    }
  }
</style>
<div id="spectator-game-layer">
  <div class="quiz-header">
    <div class="mode-badge spectator">
      <span class="material-symbols-outlined" style="font-size: 1.1rem; color: #ef4444; animation: pulseGlow 1s infinite alternate;">fiber_manual_record</span>
      <span id="current-mode-title">관전 모드 (LIVE)</span>
    </div>
    <button class="pause-btn" onclick="exitSpectatorTrigger()" aria-label="관전 종료">
      <span class="material-symbols-outlined" style="font-size: 1.3rem;">close</span>
    </button>
  </div>

  <div class="timer-bar-container">
    <div id="timer-progress-bar"></div>
  </div>

  <div class="dashboard">
    <div id="weight-display"></div>
  </div>

  <div class="spectator-display">
    <div id="spectator-char">-</div>
  </div>
</div>
