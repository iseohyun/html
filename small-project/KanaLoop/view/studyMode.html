<div id="quiz-game-layer">
  <div class="quiz-header">
    <div class="mode-badge study">
      <span class="material-symbols-outlined" style="font-size: 1.1rem;">school</span>
      <span id="current-mode-title">학습 모드</span>
    </div>
    <button class="pause-btn" onclick="pauseGameTrigger()" aria-label="일시정지" title="일시정지">
      <span class="material-symbols-outlined" style="font-size: 1.3rem;">pause</span>
    </button>
  </div>

  <div class="timer-bar-container">
    <div id="timer-progress-bar"></div>
  </div>

  <div class="dashboard">
    <div id="weight-display"></div>
    <div id="history-bar"></div>
  </div>

  <div class="play-area">
    <button id="audio-trigger" title="발음 듣기" aria-label="발음 다시 듣기">
      <span class="material-symbols-outlined">volume_up</span>
    </button>
    <div id="options" class="options-grid"></div>
  </div>
</div>
