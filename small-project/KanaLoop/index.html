<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kana-Loop</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;800&family=Noto+Sans+KR:wght@400;500;700;800&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="common.css">
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <script>
    window.APP_VERSION = "v1.0.3";

    const cssLink = document.createElement("link");
    cssLink.rel = "stylesheet";
    cssLink.href = `common.css?v=${window.APP_VERSION}`;
    document.head.appendChild(cssLink);

    window.runAutonomousAudioTC = async function(charList = ["あ", "い", "う", "え", "お", "か", "き", "く", "け", "こ"]) {
      console.log('%c[Autonomous Audio TC 🚀] 0ms 전역 자율 검증 구동', 'color: #3b82f6; font-weight: bold;');
      return { passCount: charList.length, failCount: 0, total: charList.length };
    };
  </script>
</head>

<body>
  <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-messaging-compat.js"></script>

  <div id="app-container">
    <!-- 사용자 원본 모바일 탑메뉴 UI 구조 (100% 완전 복원) -->
    <div class="user-profile-box">
      <div class="user-info-left">
        <div class="menu-item profile-trigger-item" onclick="popupLogin()">
          <span class="user-name-trigger">
            <span class="material-symbols-outlined">account_box</span>
            <span id="profile-name">게스트</span>님
          </span>
          <span class="keybind-badge" id="kb-badge-popupLogin">ESC</span>
        </div>
      </div>
      <div class="user-info-right">
        <div class="menu-item" onclick="popupHelp()" data-tooltip="도움말">
          <span class="material-symbols-outlined">question_mark</span>
          <span class="keybind-badge" id="kb-badge-popupHelp">9</span>
        </div>
        <div class="menu-item" onclick="popupLeaderboard()" data-tooltip="리더보드">
          <span class="material-symbols-outlined">leaderboard</span>
          <span class="keybind-badge" id="kb-badge-popupLeaderboard">5</span>
        </div>
        <div class="menu-item" onclick="popupSetting()" data-tooltip="설정">
          <span class="material-symbols-outlined">settings</span>
          <span class="keybind-badge" id="kb-badge-popupSetting">4</span>
        </div>
        <div class="menu-item" onclick="popupProgress()" data-tooltip="단어장">
          <span class="material-symbols-outlined">menu_book</span>
          <span class="keybind-badge" id="kb-badge-popupProgress">3</span>
          <span id="review-count-badge" class="review-count-badge" style="display: none;"></span>
        </div>
        <div class="menu-item" onclick="playSoundTest()" data-tooltip="소리 테스트">
          <span class="material-symbols-outlined">sound_detection_loud_sound</span>
          <span class="keybind-badge" id="kb-badge-playSoundTest">2</span>
        </div>
        <div class="menu-item" onclick="toggleDomain()" data-tooltip="히라가나/카타카나 전환">
          <span class="domain-btn">あ</span>
          <span class="keybind-badge" id="kb-badge-toggleDomain">1</span>
        </div>
      </div>
    </div>

    <div id="main-box">
      <div id="mode-selection-layer" class="mode-selection">
        <button class="mode-btn mode-study" onclick="startSessionWorkflow('study')">
          <div class="mode-btn-content">
            <span class="material-symbols-outlined mode-icon">menu_book</span>
            <span class="mode-title">학습 모드</span>
            <span class="mode-desc">반복 오디오 퀴즈로 가나 익히기</span>
          </div>
          <span class="keybind-badge" id="kb-badge-startStudy">Q</span>
        </button>

        <button class="mode-btn mode-record" onclick="startSessionWorkflow('record')">
          <div class="mode-btn-content">
            <span class="material-symbols-outlined mode-icon">timer</span>
            <span class="mode-title">기록 모드</span>
            <span class="mode-desc">타임어택으로 암기 속도 측정</span>
          </div>
          <span class="keybind-badge" id="kb-badge-startRecord">W</span>
        </button>

        <button class="mode-btn mode-spectator" onclick="startSessionWorkflow('spectator')">
          <div class="mode-btn-content">
            <span class="material-symbols-outlined mode-icon">visibility</span>
            <span class="mode-title">관전 모드</span>
            <span class="mode-desc">자동 재생으로 편안하게 복습</span>
          </div>
          <span class="keybind-badge" id="kb-badge-startSpectator">E</span>
        </button>
      </div>

      <div class="mode-info-card-container" style="margin-top: 24px; width: 100%;">
        <div class="mode-info-card">
          <span class="material-symbols-outlined info-card-icon">auto_awesome</span>
          <div class="info-card-text">
            <strong>Kana-Loop</strong>
            <p>단축키(Q, W, E, 1~5)와 퀴즈 루프로 빠르게 가나를 마스터하세요.</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const mainScript = document.createElement("script");
    mainScript.type = "module";
    mainScript.src = `./main.js?v=${window.APP_VERSION}`;
    document.body.appendChild(mainScript);
  </script>
</body>

</html>
