<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Webpointer Zero-Dependency In-Browser Test Runner</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --pass: #10b981;
      --fail: #ef4444;
      --pending: #64748b;
      --running: #f59e0b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 24px; min-height: 100vh; display: flex; flex-direction: column; gap: 20px; }
    
    header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px; border-bottom: 1px solid var(--card-border); padding-bottom: 16px; }
    .title-area h1 { font-size: 1.5rem; font-weight: 800; color: #ffffff; display: flex; align-items: center; gap: 10px; }
    .title-area p { font-size: 0.85rem; color: var(--text-muted); margin-top: 4px; }
    
    .stats-bar { display: flex; gap: 12px; align-items: center; }
    .stat-badge { padding: 6px 14px; border-radius: 9999px; font-weight: 700; font-size: 0.85rem; display: flex; align-items: center; gap: 6px; }
    .stat-badge.total { background: #334155; color: #f8fafc; }
    .stat-badge.pass { background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid #059669; }
    .stat-badge.fail { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid #dc2626; }
    
    .controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .btn { padding: 8px 18px; border-radius: 8px; font-weight: 700; font-size: 0.88rem; cursor: pointer; border: none; transition: all 0.2s; display: flex; align-items: center; gap: 6px; }
    .btn-primary { background: var(--accent); color: #0f172a; }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-secondary { background: #334155; color: #f8fafc; border: 1px solid var(--card-border); }
    .btn-secondary:hover { background: #475569; }
    
    .search-input { padding: 8px 14px; border-radius: 8px; border: 1px solid var(--card-border); background: #0b1120; color: #fff; font-size: 0.88rem; outline: none; width: 220px; }
    .search-input:focus { border-color: var(--accent); }

    .progress-track { width: 100%; height: 6px; background: #334155; border-radius: 3px; overflow: hidden; position: relative; }
    .progress-fill { height: 100%; width: 0%; background: var(--accent); transition: width 0.15s ease; }

    .layout-grid { display: grid; grid-template-columns: 1fr 420px; gap: 20px; flex: 1; }
    @media (max-width: 1100px) { .layout-grid { grid-template-columns: 1fr; } }

    .suites-container { display: flex; flex-direction: column; gap: 16px; }
    .suite-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 10px; overflow: hidden; }
    .suite-header { padding: 12px 16px; background: #182234; display: flex; justify-content: space-between; align-items: center; font-weight: 700; font-size: 0.95rem; border-bottom: 1px solid var(--card-border); cursor: pointer; }
    .suite-tests { display: flex; flex-direction: column; }
    .test-row { padding: 10px 16px; border-bottom: 1px solid rgba(51, 65, 85, 0.5); display: flex; justify-content: space-between; align-items: center; font-size: 0.86rem; transition: background 0.15s; }
    .test-row:hover { background: #253349; }
    .test-row:last-child { border-bottom: none; }
    .test-left { display: flex; align-items: center; gap: 10px; flex: 1; }
    .status-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--pending); flex-shrink: 0; }
    .status-dot.passed { background: var(--pass); box-shadow: 0 0 8px rgba(16,185,129,0.5); }
    .status-dot.failed { background: var(--fail); box-shadow: 0 0 8px rgba(239,68,68,0.5); }
    .status-dot.running { background: var(--running); animation: pulse 1s infinite; }
    @keyframes pulse { 0% { opacity: 0.4; } 50% { opacity: 1; } 100% { opacity: 0.4; } }
    
    .tc-id { font-weight: 700; color: var(--accent); min-width: 60px; }
    .tc-name { color: #cbd5e1; word-break: break-all; }
    .test-right { display: flex; align-items: center; gap: 12px; }
    .test-duration { font-size: 0.75rem; color: var(--text-muted); font-family: monospace; }
    .run-single-btn { padding: 3px 8px; font-size: 0.75rem; background: #334155; color: #f8fafc; border: none; border-radius: 4px; cursor: pointer; }
    .run-single-btn:hover { background: var(--accent); color: #0f172a; }

    .error-box { margin: 6px 16px 12px 36px; padding: 10px; background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.3); border-radius: 6px; color: #fca5a5; font-size: 0.8rem; font-family: monospace; white-space: pre-wrap; word-break: break-all; }

    .iframe-sidebar { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 10px; display: flex; flex-direction: column; overflow: hidden; }
    .iframe-header { padding: 10px 14px; background: #182234; border-bottom: 1px solid var(--card-border); font-size: 0.82rem; font-weight: 700; color: var(--text-muted); display: flex; justify-content: space-between; align-items: center; }
    .iframe-wrap { flex: 1; min-height: 400px; background: #ffffff; }
    iframe { width: 100%; height: 100%; border: none; }
  </style>
</head>
<body>

  <header>
    <div class="title-area">
      <h1>🧪 Webpointer Test Runner <span style="font-size:0.8rem; font-weight:normal; background:#0284c7; color:#fff; padding:2px 8px; border-radius:4px;">In-Browser Zero-Dependency</span></h1>
      <p>Playwright 설치 없이 모든 브라우저에서 실행 가능한 독립형 E2E/단위 테스트 환경</p>
    </div>

    <div class="stats-bar">
      <div class="stat-badge total" id="statTotal">Total: 0</div>
      <div class="stat-badge pass" id="statPass">Pass: 0</div>
      <div class="stat-badge fail" id="statFail">Fail: 0</div>
    </div>

    <div class="controls">
      <input type="text" class="search-input" id="searchInput" placeholder="검색 (예: TC60, 색상, 정렬)...">
      <button class="btn btn-primary" id="btnRunAll">▶ 전체 실행 (Run All)</button>
      <button class="btn btn-secondary" id="btnRunFailed">↺ 실패 항목 재실행</button>
    </div>
  </header>

  <div class="progress-track">
    <div class="progress-fill" id="progressFill"></div>
  </div>

  <div class="layout-grid">
    <div class="suites-container" id="suitesContainer"></div>

    <div class="iframe-sidebar">
      <div class="iframe-header">
        <span>🌐 Live App Instance</span>
        <span id="appStatus" style="color:#10b981;">Ready</span>
      </div>
      <div class="iframe-wrap">
        <iframe id="appFrame" src="../index.html"></iframe>
      </div>
    </div>
  </div>

  <!-- Test Framework Core -->
  <script src="testEngine.js"></script>

  <!-- Modular Test Suites -->
  <script src="suites/suite-01-basic.js"></script>
  <script src="suites/suite-02-shapes.js"></script>
  <script src="suites/suite-03-styles.js"></script>
  <script src="suites/suite-04-text.js"></script>
  <script src="suites/suite-05-bezier.js"></script>
  <script src="suites/suite-06-tools.js"></script>
  <script src="suites/suite-07-storage.js"></script>

  <!-- Dashboard UI Logic -->
  <script>
    (function() {
      var runner = window.WebpointerTest;
      var appFrame = document.getElementById('appFrame');
      var suitesContainer = document.getElementById('suitesContainer');
      var statTotal = document.getElementById('statTotal');
      var statPass = document.getElementById('statPass');
      var statFail = document.getElementById('statFail');
      var progressFill = document.getElementById('progressFill');
      var searchInput = document.getElementById('searchInput');
      var btnRunAll = document.getElementById('btnRunAll');
      var btnRunFailed = document.getElementById('btnRunFailed');

      function getAppWindow() {
        return appFrame.contentWindow || window;
      }

      function updateStats() {
        var tests = runner.getAllTests();
        var passCount = tests.filter(function(t) { return t.status === 'passed'; }).length;
        var failCount = tests.filter(function(t) { return t.status === 'failed'; }).length;
        var runCount = passCount + failCount;

        statTotal.textContent = 'Total: ' + tests.length;
        statPass.textContent = 'Pass: ' + passCount;
        statFail.textContent = 'Fail: ' + failCount;

        var pct = tests.length > 0 ? ((runCount / tests.length) * 100) : 0;
        progressFill.style.width = pct + '%';
        progressFill.style.background = failCount > 0 ? '#ef4444' : '#38bdf8';
      }

      function renderSuites(filterText) {
        suitesContainer.innerHTML = '';
        var q = (filterText || '').toLowerCase();

        runner.suites.forEach(function(suite) {
          var filteredTests = suite.tests.filter(function(t) {
            if (!q) return true;
            return t.id.toLowerCase().includes(q) || t.name.toLowerCase().includes(q) || suite.name.toLowerCase().includes(q);
          });

          if (filteredTests.length === 0) return;

          var suiteCard = document.createElement('div');
          suiteCard.className = 'suite-card';

          var suiteHeader = document.createElement('div');
          suiteHeader.className = 'suite-header';
          suiteHeader.innerHTML = '<span>' + suite.name + '</span><span style="font-size:0.8rem; color:#94a3b8;">' + filteredTests.length + ' tests</span>';

          var suiteBody = document.createElement('div');
          suiteBody.className = 'suite-tests';

          filteredTests.forEach(function(testItem) {
            var row = document.createElement('div');
            row.className = 'test-row';
            row.id = 'row_' + testItem.id;

            var dotClass = testItem.status === 'passed' ? 'passed' : (testItem.status === 'failed' ? 'failed' : (testItem.status === 'running' ? 'running' : ''));

            row.innerHTML =
              '<div class="test-left">' +
                '<div class="status-dot ' + dotClass + '" id="dot_' + testItem.id + '"></div>' +
                '<span class="tc-id">' + testItem.id + '</span>' +
                '<span class="tc-name">' + testItem.name + '</span>' +
              '</div>' +
              '<div class="test-right">' +
                '<span class="test-duration" id="dur_' + testItem.id + '">' + (testItem.duration ? testItem.duration + 'ms' : '') + '</span>' +
                '<button class="run-single-btn" data-tcid="' + testItem.id + '">실행</button>' +
              '</div>';

            var runBtn = row.querySelector('.run-single-btn');
            runBtn.onclick = async function(e) {
              e.stopPropagation();
              await runner.runTest(testItem, getAppWindow());
              renderSuites(searchInput.value);
            };

            suiteBody.appendChild(row);

            if (testItem.status === 'failed' && testItem.error) {
              var errBox = document.createElement('div');
              errBox.className = 'error-box';
              errBox.textContent = testItem.error;
              suiteBody.appendChild(errBox);
            }
          });

          suiteCard.appendChild(suiteHeader);
          suiteCard.appendChild(suiteBody);
          suitesContainer.appendChild(suiteCard);
        });

        updateStats();
      }

      runner.onEvent(function(eventName, data) {
        if (eventName === 'test_start' || eventName === 'test_end') {
          var dot = document.getElementById('dot_' + data.id);
          var dur = document.getElementById('dur_' + data.id);
          if (dot) {
            dot.className = 'status-dot ' + (data.status === 'passed' ? 'passed' : (data.status === 'failed' ? 'failed' : (data.status === 'running' ? 'running' : '')));
          }
          if (dur && data.duration) {
            dur.textContent = data.duration + 'ms';
          }
          updateStats();
        } else if (eventName === 'run_complete') {
          renderSuites(searchInput.value);
        }
      });

      searchInput.oninput = function() {
        renderSuites(searchInput.value);
      };

      btnRunAll.onclick = async function() {
        btnRunAll.disabled = true;
        btnRunAll.textContent = '⏳ 실행 중...';
        await runner.runAll(searchInput.value, getAppWindow());
        btnRunAll.disabled = false;
        btnRunAll.textContent = '▶ 전체 실행 (Run All)';
      };

      btnRunFailed.onclick = async function() {
        var failedTests = runner.getAllTests().filter(function(t) { return t.status === 'failed'; });
        for (var i = 0; i < failedTests.length; i++) {
          await runner.runTest(failedTests[i], getAppWindow());
        }
        renderSuites(searchInput.value);
      };

      appFrame.onload = function() {
        renderSuites();
      };
    })();
  </script>
</body>
</html>
