<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="652" viewBox="0 0 1240 652" font-family="'Pretendard', 'Malgun Gothic', 'Apple SD Gothic Neo', 'Nanum Gothic', sans-serif">
  <title>개발 환경 개념(환경설정 · Binary · 형상관리)</title>
  <desc>IDE와 OS(Platform)의 관계를 환경설정으로, IDE가 관리하는 CODE가 Binary(bin)로 번역되어 OS를 통과해 HW와 통화하는 과정을 어셈블리·바이너리로, CODE와 STORAGE의 관계를 형상관리(Git)로 정의한 아키텍처 다이어그램입니다.</desc>

  <defs>
    <filter id="tm-cardShadow" x="-3%" y="-4%" width="106%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>

    <marker id="tm-arrDark" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M1,1.5 L9,5 L1,8.5 Z" fill="#1e293b"/>
    </marker>
    <marker id="tm-arrBlue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M1,1.5 L9,5 L1,8.5 Z" fill="#2563eb"/>
    </marker>
    <marker id="tm-arrAmber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M1,1.5 L9,5 L1,8.5 Z" fill="#d97706"/>
    </marker>
    <marker id="tm-arrGreen" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M1,1.5 L9,5 L1,8.5 Z" fill="#059669"/>
    </marker>
    <marker id="tm-arrRed" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M1,1.5 L9,5 L1,8.5 Z" fill="#dc2626"/>
    </marker>

    <clipPath id="tm-clipIde"><rect x="32" y="20" width="380" height="118" rx="12"/></clipPath>
    <clipPath id="tm-clipEnv"><rect x="32" y="166" width="380" height="310" rx="12"/></clipPath>
    <clipPath id="tm-clipCode"><rect x="492" y="20" width="340" height="148" rx="12"/></clipPath>
    <clipPath id="tm-clipBin"><rect x="492" y="204" width="340" height="266" rx="12"/></clipPath>
    <clipPath id="tm-clipVcs"><rect x="916" y="20" width="292" height="240" rx="12"/></clipPath>
    <clipPath id="tm-clipHw"><rect x="916" y="448" width="292" height="184" rx="12"/></clipPath>
  </defs>

  <!-- 전체 종이 배경 -->
  <rect width="1240" height="652" rx="16" fill="#fcfcfa" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- ====================================================================== -->
  <!-- [좌측 상단 노드] IDE / Code Editor                                      -->
  <!-- ====================================================================== -->
  <g clip-path="url(#tm-clipIde)" filter="url(#tm-cardShadow)">
    <rect x="32" y="20" width="380" height="118" fill="#ffffff"/>
    <rect x="32" y="20" width="380" height="36" fill="#f1f5f9"/>
    <line x1="32" y1="56" x2="412" y2="56" stroke="#cbd5e1" stroke-width="1.2"/>
  </g>
  <rect data-key="node-ide" x="32" y="20" width="380" height="118" rx="12" fill="none" stroke="#1e293b" stroke-width="2.2"/>
  <text x="48" y="43" font-size="15" font-weight="800" fill="#0f172a">IDE / Code Editor</text>
  

  <text x="48" y="79" font-size="11" font-weight="700" fill="#2563eb">· 도구 실행과 파일 접근은 아래 OS(Platform)에 요청해 수행</text>
  <text x="48" y="100" font-size="11.5" fill="#334155">· VS Code · Cursor · MSVS</text>



  <!-- ==================== 브릿지: IDE ──▶ CODE (코드 관리) ==================== -->
  <line x1="414" y1="79" x2="486" y2="79" stroke="#1e293b" stroke-width="2.2" marker-end="url(#tm-arrDark)"/>
  <text x="452" y="68" text-anchor="middle" font-size="11" font-weight="800" fill="#0f172a">코드 관리</text>
  <text x="452" y="97" text-anchor="middle" font-size="10" font-weight="600" fill="#475569">작성 · 분석</text>


  <!-- ====================================================================== -->
  <!-- [중앙 상단 노드] CODE (.c / .h)                                         -->
  <!-- ====================================================================== -->
  <g clip-path="url(#tm-clipCode)" filter="url(#tm-cardShadow)">
    <rect x="492" y="20" width="340" height="148" fill="#ffffff"/>
    <rect x="492" y="20" width="340" height="36" fill="#dbeafe"/>
    <line x1="492" y1="56" x2="832" y2="56" stroke="#93c5fd" stroke-width="1.2"/>
  </g>
  <rect data-key="node-code" x="492" y="20" width="340" height="148" rx="12" fill="none" stroke="#2563eb" stroke-width="2.2"/>
  <text x="508" y="43" font-size="15" font-weight="800" fill="#1e3a8a">CODE (소스 코드)</text>
  <rect x="682" y="28" width="136" height="20" rx="10" fill="#ffffff" stroke="#93c5fd"/>
  <text x="750" y="42" text-anchor="middle" font-family="'D2Coding', Consolas, monospace" font-size="10.5" font-weight="700" fill="#1d4ed8">hello.c · .h (UTF-8)</text>

  <text x="508" y="78" font-size="11.4" fill="#334155">· 인간이 읽고 설계하는 고수준 텍스트 원본</text>
  <rect x="506" y="88" width="312" height="68" rx="7" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="518" y="107" font-size="11" font-weight="800" fill="#1e293b">에러 3단 구분 &amp; 언어 표준 (-std=c17 · c23)</text>
  <text x="518" y="126" font-size="10.3" fill="#475569">· 에디터 밑줄(LSP) vs 문법 에러(컴파일) vs 링크 에러(ld)</text>
  <text x="518" y="144" font-size="10.3" font-weight="700" fill="#2563eb">· 컴파일러 프로그램 버전(GCC) ≠ 언어 문법 표준(-std)</text>


  <!-- ==================== 브릿지: CODE ◀──▶ STORAGE (형상관리) ==================== -->
  <line x1="836" y1="94" x2="910" y2="94" stroke="#059669" stroke-width="2.4" marker-start="url(#tm-arrGreen)" marker-end="url(#tm-arrGreen)"/>
  <rect x="840" y="63" width="68" height="21" rx="10.5" fill="#059669"/>
  <text x="874" y="77" text-anchor="middle" font-size="10.5" font-weight="800" fill="#ffffff">형상관리</text>
  <text x="874" y="113" text-anchor="middle" font-size="10" font-weight="700" fill="#065f46">Git 동기화</text>


  <!-- ====================================================================== -->
  <!-- [우측 상단 노드] ③ 형상관리 & STORAGE                                   -->
  <!-- ====================================================================== -->
  <g clip-path="url(#tm-clipVcs)" filter="url(#tm-cardShadow)">
    <rect x="916" y="20" width="292" height="240" fill="#f0fdf4"/>
    <rect x="916" y="20" width="292" height="38" fill="#059669"/>
  </g>
  <rect data-key="rel-vcs" x="916" y="20" width="292" height="240" rx="12" fill="none" stroke="#059669" stroke-width="2.2"/>
  <text x="1062" y="44" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">③ 형상관리 &amp; STORAGE</text>

  <text x="932" y="80" font-size="11.5" font-weight="800" fill="#065f46">로컬 저장소(.git) · 원격 서버(GitHub)</text>
  <text x="932" y="101" font-size="11" fill="#334155">· 코드 변경 이력(commit) 기록 및 시점 복구</text>
  <text x="932" y="121" font-size="11" fill="#334155">· 브랜치(branch) 분리 실험 · 안전한 원격 백업</text>

  <rect x="930" y="136" width="264" height="110" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.3"/>
  <text x="942" y="156" font-size="11.2" font-weight="800" fill="#065f46">핵심 원칙: .gitignore 분리 보관</text>
  <text x="942" y="176" font-size="10.5" font-weight="700" fill="#047857">✓ 저장함: CODE (.c · .h) · 설정(.json)</text>
  <text x="942" y="195" font-size="10.5" font-weight="700" fill="#b91c1c">✕ 제외함: Binary (.exe · .o · .s)</text>
  <text x="942" y="216" font-size="10" fill="#64748b">언제든 다시 빌드해 만들 수 있는 기계어 파일은</text>
  <text x="942" y="232" font-size="10" fill="#64748b">충돌·용량 낭비를 막기 위해 저장소에서 제외</text>


  <!-- ====================================================================== -->
  <!-- [좌측 중단 브릿지 허브] ① 환경설정 (IDE ⇅ OS 관계)                      -->
  <!-- ====================================================================== -->
  <line x1="222" y1="140" x2="222" y2="164" stroke="#2563eb" stroke-width="2.6" marker-start="url(#tm-arrBlue)" marker-end="url(#tm-arrBlue)"/>
  <line x1="222" y1="478" x2="222" y2="502" stroke="#2563eb" stroke-width="2.6" marker-start="url(#tm-arrBlue)" marker-end="url(#tm-arrBlue)"/>

  <g clip-path="url(#tm-clipEnv)" filter="url(#tm-cardShadow)">
    <rect x="32" y="166" width="380" height="310" fill="#eff6ff"/>
    <rect x="32" y="166" width="380" height="38" fill="#2563eb"/>
  </g>
  <rect data-key="rel-env" x="32" y="166" width="380" height="310" rx="12" fill="none" stroke="#2563eb" stroke-width="2"/>
  <text x="222" y="190" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">① 환경설정 (IDE ↔ OS 연결 규칙)</text>

  <!-- 환경세팅 기본: PATH & JSON -->
  <rect x="46" y="214" width="352" height="64" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="58" y="233" font-size="11.5" font-weight="800" fill="#1e3a8a">실행 경로 등록: 시스템 환경 변수 (PATH)</text>
  <text x="58" y="252" font-size="10.6" fill="#334155">· IDE와 터미널이 OS에서 gcc.exe · gdb.exe 위치를 찾는 이정표</text>
  <text x="58" y="269" font-size="10.4" font-weight="700" fill="#b91c1c">· 누락 시: 'gcc'은(는) 내부 또는 외부 명령이 아닙니다 오류</text>

  <!-- 환경세팅 1번: Permission denied & 백신 오진 -->
  <rect x="46" y="286" width="352" height="84" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.3"/>
  <text x="58" y="305" font-size="11.4" font-weight="800" fill="#b91c1c">프로세스 점유(Permission denied) · 백신 차단</text>
  <text x="58" y="324" font-size="10.5" fill="#7f1d1d">· 이전 실행 창(.exe)이 열려 있으면 OS가 파일 덮어쓰기를 거부</text>
  <text x="58" y="342" font-size="10.5" fill="#7f1d1d">· 서명 없는 자작 .exe를 백신(Defender)이 악성코드로 오진 격리</text>
  <text x="58" y="360" font-size="10.3" font-weight="700" fill="#991b1b">➔ 기존 실행 창 종료 후 재빌드 / 실습 폴더 백신 예외 설정</text>

  <!-- 환경세팅 2번: 한글·공백 경로, PowerShell .\ 규칙, UTF-8 인코딩 -->
  <rect x="46" y="378" width="352" height="86" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="58" y="397" font-size="11.4" font-weight="800" fill="#1e3a8a">한글·공백 경로 · 터미널 셸(PowerShell) · 인코딩</text>
  <text x="58" y="416" font-size="10.5" fill="#334155">· 폴더 경로에 한글·공백 포함 시 명령줄 인자 분리 오류 발생</text>
  <text x="58" y="434" font-size="10.5" fill="#334155">· PowerShell 보안 정책: 현재 폴더 실행 시 .\hello.exe 명시 필수</text>
  <text x="58" y="452" font-size="10.5" font-weight="700" fill="#1d4ed8">· 한글 깨짐 방지: 소스(UTF-8) ↔ 콘솔 코드페이지(65001) 일치</text>


  <!-- ====================================================================== -->
  <!-- [중앙 중단 브릿지] ② 어셈블리 & Binary (CODE ➔ OS 통과 ➔ HW)            -->
  <!-- ====================================================================== -->
  <line x1="662" y1="168" x2="662" y2="200" stroke="#d97706" stroke-width="2.4" marker-end="url(#tm-arrAmber)"/>
  <text x="674" y="189" font-size="10.5" font-weight="700" fill="#b45309">컴파일 번역</text>

  <g clip-path="url(#tm-clipBin)" filter="url(#tm-cardShadow)">
    <rect x="492" y="204" width="340" height="266" fill="#fffbeb"/>
    <rect x="492" y="204" width="340" height="38" fill="#d97706"/>
  </g>
  <rect data-key="rel-bin" x="492" y="204" width="340" height="266" rx="12" fill="none" stroke="#d97706" stroke-width="2.2"/>
  <text x="662" y="228" text-anchor="middle" font-size="13.8" font-weight="800" fill="#ffffff">② 어셈블리(.s) &amp; Binary (bin / .exe)</text>

  <!-- 어셈블리 개념 -->
  <rect x="506" y="252" width="312" height="74" rx="8" fill="#ffffff" stroke="#fcd34d" stroke-width="1.3"/>
  <text x="518" y="271" font-size="11.4" font-weight="800" fill="#92400e">어셈블리 (Assembly, .s) — 기계어 1:1 기호</text>
  <text x="518" y="290" font-size="10.5" fill="#334155">· 인간 언어(CODE)와 0101 기계어 사이의 직관적 번역 단계</text>
  <text x="518" y="309" font-family="'D2Coding', Consolas, monospace" font-size="10.3" font-weight="700" fill="#b45309">· gcc -S hello.c ➔ pushq, movq, call 명령 확인</text>

  <line x1="662" y1="326" x2="662" y2="346" stroke="#d97706" stroke-width="2" marker-end="url(#tm-arrAmber)"/>
  <text x="674" y="341" font-size="10" font-weight="700" fill="#92400e">어셈블(.o) + 링크(.a)</text>

  <!-- Binary(bin) 개념 -->
  <rect x="506" y="350" width="312" height="108" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="518" y="371" font-size="12" font-weight="800" fill="#fde68a">Binary (bin / hello.exe)</text>
  <text x="518" y="391" font-family="'D2Coding', Consolas, monospace" font-size="10.5" fill="#67e8f9">01001101 01011010 ... (실행 헤더 + 순수 기계어)</text>
  <text x="518" y="412" font-size="10.5" fill="#e2e8f0">· 타겟 OS 규격(PE/ELF)과 CPU 명령어 집합에 종속됨</text>
  <text x="518" y="432" font-size="10.4" font-weight="700" fill="#86efac">· 디버그 심볼(-g): bin 내부에 .c 줄 번호표를 함께 심어</text>
  <text x="518" y="448" font-size="10.2" fill="#86efac">  중단점(Breakpoint) 디버깅을 가능하게 함</text>

  <!-- Binary -> OS 관문 진입 화살표 -->
  <line x1="662" y1="470" x2="662" y2="516" stroke="#d97706" stroke-width="2.6" marker-end="url(#tm-arrAmber)"/>


  <!-- ====================================================================== -->
  <!-- [하단 플랫폼 계층] OS (Platform: Windows · Linux · macOS)               -->
  <!-- ====================================================================== -->
  <g filter="url(#tm-cardShadow)">
    <rect data-key="node-os" x="32" y="506" width="800" height="126" rx="12" fill="#f1f5f9" stroke="#334155" stroke-width="2.2"/>
  </g>

  <!-- OS 좌측 설명 (환경설정 대응부) -->
  <rect x="48" y="520" width="194" height="24" rx="6" fill="#1e293b"/>
  <text x="145" y="536" text-anchor="middle" font-size="11.8" font-weight="800" fill="#ffffff">Platform (OS(운영체제))</text>
  <text x="48" y="564" font-size="11.3" font-weight="700" fill="#1e293b">· PATH 탐색 · 파일 잠금 · 실행 권한 및 보안 통제</text>
  <text x="48" y="585" font-size="11" fill="#475569">· 터미널 셸(PowerShell · cmd) 및 콘솔 코드페이지 제공</text>
  <text x="48" y="606" font-size="11" fill="#475569">· 하드웨어를 직접 건드리지 못하도록 보호하는 중재 계층</text>

  <!-- OS 우측 내부 통과 게이트 (Binary 통과 지점) -->
  <rect x="492" y="520" width="326" height="98" rx="9" fill="#ffffff" stroke="#d97706" stroke-width="1.8" stroke-dasharray="5 3"/>
  <text x="655" y="542" text-anchor="middle" font-size="11.8" font-weight="800" fill="#92400e">OS 실행 관문 통과 (Loader &amp; System Call)</text>
  <text x="655" y="564" text-anchor="middle" font-size="10.6" fill="#334155">1) 로더(Loader)가 Binary(.exe)를 메모리(RAM)에 적재</text>
  <text x="655" y="583" text-anchor="middle" font-size="10.6" fill="#334155">2) 화면 출력(printf)·파일 접근 시 OS 시스템 콜 통과</text>
  <text x="655" y="603" text-anchor="middle" font-size="10.3" font-weight="700" fill="#b45309">※ OS 없는 임베디드(MCU)만 Binary가 HW에 바로 기록됨</text>


  <!-- ==================== 브릿지: OS ══▶ HW (기계어 통화) ==================== -->
  <line x1="834" y1="569" x2="910" y2="569" stroke="#dc2626" stroke-width="2.8" marker-end="url(#tm-arrRed)"/>
  <text x="874" y="555" text-anchor="middle" font-size="10.8" font-weight="800" fill="#b91c1c">0101 통화</text>
  <text x="874" y="588" text-anchor="middle" font-size="10" font-weight="700" fill="#475569">기계어 직결</text>


  <!-- ====================================================================== -->
  <!-- [우측 하단 노드] HW (Hardware: CPU · RAM)                               -->
  <!-- ====================================================================== -->
  <g clip-path="url(#tm-clipHw)" filter="url(#tm-cardShadow)">
    <rect x="916" y="448" width="292" height="184" fill="#0f172a"/>
    <rect x="916" y="448" width="292" height="38" fill="#991b1b"/>
  </g>
  <rect data-key="node-hw" x="916" y="448" width="292" height="184" rx="12" fill="none" stroke="#dc2626" stroke-width="2.2"/>
  <text x="1062" y="472" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">HW (하드웨어 · 실리콘 칩셋)</text>

  <rect x="930" y="498" width="264" height="56" rx="7" fill="#1e293b" stroke="#475569"/>
  <text x="942" y="518" font-size="11.6" font-weight="800" fill="#fca5a5">CPU (x86_64 · ARM · RISC-V)</text>
  <text x="942" y="538" font-size="10.5" fill="#cbd5e1">0과 1의 전압 신호로 기계어 명령 직접 연산</text>

  <rect x="930" y="562" width="264" height="56" rx="7" fill="#1e293b" stroke="#475569"/>
  <text x="942" y="582" font-size="11.6" font-weight="800" fill="#67e8f9">RAM (메모리) &amp; 주변 입출력 장치</text>
  <text x="942" y="602" font-size="10.5" fill="#cbd5e1">실행 코드·변수 주소 공간 및 모니터·키보드 제어</text>
</svg>
