<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" font-family="'Pretendard', 'Malgun Gothic', 'Apple SD Gothic Neo', 'Nanum Gothic', sans-serif">
  <title>런타임 장애를 컴파일 타임 진단으로 앞당기는 rustc 방어선</title>
  <desc>배포 후 런타임에 터지던 C의 세그폴트·Java의 NullPointerException·Python의 타입 오류를 컴파일 단계에서 정확한 코드 위치와 해결책 힌트로 잡아내는 rustc 진단 모델을 비교합니다.</desc>

  <defs>
    <filter id="cgShadow" x="-3%" y="-4%" width="106%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect width="960" height="440" rx="14" fill="#fcfcfa" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- ==================== 좌측: 기존 언어의 런타임 폭탄 ==================== -->
  <g filter="url(#cgShadow)">
    <rect data-key="runtime-pain" x="18" y="18" width="424" height="404" rx="12" fill="#ffffff" stroke="#ef4444" stroke-width="2"/>
    <rect x="18" y="18" width="424" height="42" rx="12" fill="#fee2e2"/>
    <rect x="18" y="44" width="424" height="16" fill="#fee2e2"/>
    <text x="36" y="45" font-size="14" font-weight="800" fill="#991b1b">기존 언어: 빌드는 통과하지만 실행 중(Runtime) 폭발</text>

    <rect x="34" y="74" width="392" height="94" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
    <text x="48" y="96" font-size="12" font-weight="800" fill="#b91c1c">C / C++ — 침묵하는 메모리 오염과 세그폴트</text>
    <text x="48" y="116" font-family="'D2Coding', monospace" font-size="10.5" fill="#7f1d1d">Segmentation fault (core dumped)</text>
    <text x="48" y="136" font-size="10.4" fill="#334155">· 해제된 포인터 역참조(Use-After-Free)도 컴파일은 멀쩡히 통과</text>
    <text x="48" y="154" font-size="10.4" fill="#334155">· 멀티스레드 데이터 레이스가 특정 타이밍에만 간헐적 발생</text>

    <rect x="34" y="180" width="392" height="94" rx="8" fill="#fffbeb" stroke="#fcd34d"/>
    <text x="48" y="202" font-size="12" font-weight="800" fill="#92400e">Java — 모든 참조에 숨어 있는 Null 지뢰</text>
    <text x="48" y="222" font-family="'D2Coding', monospace" font-size="10.5" fill="#b45309">java.lang.NullPointerException: Cannot invoke...</text>
    <text x="48" y="242" font-size="10.4" fill="#334155">· User 타입 변수라도 실제로는 null일 수 있어 방어 코드가 누락됨</text>
    <text x="48" y="260" font-size="10.4" fill="#334155">· 공유 컬렉션을 여러 스레드가 수정할 때 런타임 예외 발생</text>

    <rect x="34" y="286" width="392" height="120" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="48" y="308" font-size="12" font-weight="800" fill="#1e293b">Python — 해당 분기가 실행될 때까지 모르는 오류</text>
    <text x="48" y="328" font-family="'D2Coding', monospace" font-size="10.5" fill="#dc2626">AttributeError: 'NoneType' object has no attribute...</text>
    <text x="48" y="348" font-size="10.4" fill="#334155">· 드물게 타는 예외 분기 속 오타·타입 불일치가 운영 서버에서 발각</text>
    <rect x="48" y="362" width="364" height="32" rx="6" fill="#fee2e2"/>
    <text x="230" y="382" text-anchor="middle" font-size="10.6" font-weight="800" fill="#991b1b">공통 비용: 배포 후 장애 추적 · 디버깅 비용 기하급수 증가</text>
  </g>

  <!-- ==================== 우측: Rust 컴파일러 페어 프로그래머 ==================== -->
  <g filter="url(#cgShadow)">
    <rect data-key="compile-guard" x="462" y="18" width="480" height="404" rx="12" fill="#ffffff" stroke="#059669" stroke-width="2.2"/>
    <rect x="462" y="18" width="480" height="42" rx="12" fill="#d1fae5"/>
    <rect x="462" y="44" width="480" height="16" fill="#d1fae5"/>
    <text x="480" y="45" font-size="14" font-weight="800" fill="#065f46">Rust: "컴파일을 통과했다면 메모리 안전하다" (Shift-Left)</text>

    <!-- 실제 rustc 터미널 에러 메시지 재현 -->
    <rect x="478" y="74" width="448" height="222" rx="9" fill="#0f172a" stroke="#334155"/>
    <text x="492" y="96" font-family="'D2Coding', monospace" font-size="10.8" font-weight="800" fill="#f87171">error[E0382]: borrow of moved value: `s1`</text>
    <text x="492" y="114" font-family="'D2Coding', monospace" font-size="10.2" fill="#60a5fa"> --&gt; src/main.rs:4:20</text>
    <text x="492" y="132" font-family="'D2Coding', monospace" font-size="10.2" fill="#cbd5e1">2 |   let s1 = String::from("rust");</text>
    <text x="492" y="149" font-family="'D2Coding', monospace" font-size="10.2" fill="#94a3b8">  |       -- move occurs because `s1` has type `String`</text>
    <text x="492" y="166" font-family="'D2Coding', monospace" font-size="10.2" fill="#cbd5e1">3 |   let s2 = s1;</text>
    <text x="492" y="183" font-family="'D2Coding', monospace" font-size="10.2" fill="#fde047">  |            -- value moved here (소유권 이동 지점)</text>
    <text x="492" y="200" font-family="'D2Coding', monospace" font-size="10.2" fill="#cbd5e1">4 |   println!("{s1}");</text>
    <text x="492" y="217" font-family="'D2Coding', monospace" font-size="10.2" fill="#f87171">  |              ^^ value borrowed here after move</text>
    <rect x="490" y="232" width="424" height="52" rx="6" fill="#1e293b" stroke="#34d399"/>
    <text x="502" y="251" font-family="'D2Coding', monospace" font-size="10.2" font-weight="700" fill="#6ee7b7">help: consider cloning the value if performance is acceptable</text>
    <text x="502" y="271" font-family="'D2Coding', monospace" font-size="10.2" fill="#86efac">3 |   let s2 = s1.clone();  // 또는 참조(&amp;s1)를 대여하세요</text>

    <!-- 에디션(Edition) & 안정성 설명 -->
    <rect data-key="edition-box" x="478" y="308" width="448" height="98" rx="9" fill="#ecfdf5" stroke="#6ee7b7"/>
    <text x="494" y="330" font-size="12" font-weight="800" fill="#065f46">에디션(Edition 2015 · 2018 · 2021 · 2024) 하위 호환 약속</text>
    <text x="494" y="351" font-size="10.6" fill="#334155">· 3년 주기로 새 문법·예약어를 도입하되, 서로 다른 에디션의 크레이트끼리</text>
    <text x="494" y="369" font-size="10.6" fill="#334155">  100% 함께 링크·컴파일 가능 (Python 2➔3 단절 사태 원천 방지!)</text>
    <text x="494" y="391" font-family="'D2Coding', monospace" font-size="10.3" font-weight="800" fill="#047857">rustc --explain E0382 : 에러 코드별 원리와 예제를 터미널에서 즉시 열람</text>
  </g>
</svg>
