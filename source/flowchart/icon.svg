<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <!-- 흰색 둥근 사각형 배경 및 빨간 테두리 -->
  <rect x="14" y="14" width="484" height="484" rx="96" ry="96" fill="#FFFFFF" stroke="#DC3545" stroke-width="20" />

  <!-- 연결 화살표 및 분기 합류선 -->
  <g stroke="#111111" stroke-width="12.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- 1. Start -> Diamond 수직 화살표 -->
    <line x1="148" y1="138" x2="148" y2="195" />
    <polyline points="131,176 148,197 165,176" />

    <!-- 2. Diamond -> Process 수평 화살표 -->
    <line x1="219" y1="247" x2="282" y2="247" />
    <polyline points="263,230 284,247 263,264" />

    <!-- 3. Diamond -> End 수직 화살표 -->
    <line x1="148" y1="290" x2="148" y2="363" />
    <polyline points="131,344 148,365 165,344" />

    <!-- 4. Process -> End 곡선 합류선 -->
    <path d="M 364 285 L 364 302 A 16 16 0 0 1 348 318 L 164 318 A 16 16 0 0 0 148 334" />
  </g>

  <!-- Start 도형 (빨간 캡슐) -->
  <rect x="77" y="64" width="142" height="74" rx="37" ry="37" fill="#FFFFFF" stroke="#DC3545" stroke-width="15" />

  <!-- 조건 분기 도형 (검정 마름모) -->
  <polygon points="148,204 219,247 148,290 77,247" fill="#FFFFFF" stroke="#111111" stroke-width="14" stroke-linejoin="round" />

  <!-- 처리 도형 (검정 사각형) -->
  <rect x="293" y="209" width="142" height="76" rx="6" ry="6" fill="#FFFFFF" stroke="#111111" stroke-width="14" stroke-linejoin="round" />

  <!-- End 도형 (검정 캡슐) -->
  <rect x="77" y="374" width="142" height="74" rx="37" ry="37" fill="#FFFFFF" stroke="#111111" stroke-width="14" />
</svg>
