<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" font-family="'Pretendard', 'Malgun Gothic', 'Apple SD Gothic Neo', 'Nanum Gothic', sans-serif">
  <title>IDE 및 모던 코드 에디터의 공통 화면 구성 블록도</title>
  <desc>상단 Menu Bar, 좌측 끝 Activity Bar, 좌측 Left Side Bar, 중앙 Editor Area와 그 위에 뜨는 Command Palette(명령 팔레트), 하단 Panel, 우측 Right Side Bar, 최하단 Status Bar로 이루어진 현대 개발 도구의 표준 화면 구성도입니다.</desc>

  <defs>
    <filter id="paletteShadow" x="-6%" y="-8%" width="112%" height="124%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.38"/>
    </filter>
    <clipPath id="clipLeftSb"><rect x="86" y="58" width="178" height="368" rx="8"/></clipPath>
    <clipPath id="clipRightSb"><rect x="756" y="58" width="192" height="368" rx="8"/></clipPath>
    <clipPath id="clipEditor"><rect x="272" y="58" width="476" height="238" rx="8"/></clipPath>
    <clipPath id="clipPanel"><rect x="272" y="304" width="476" height="122" rx="8"/></clipPath>
  </defs>

  <!-- 외부 창 프레임 -->
  <rect width="960" height="480" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>

  <!-- ==================== 1. Menu Bar (상단 메뉴 바) ==================== -->
  <rect data-key="menubar" x="12" y="12" width="936" height="38" rx="8" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.6"/>
  <circle cx="30" cy="31" r="4.8" fill="#f87171"/>
  <circle cx="45" cy="31" r="4.8" fill="#fbbf24"/>
  <circle cx="60" cy="31" r="4.8" fill="#34d399"/>
  <text x="80" y="35" font-size="12.5" font-weight="800" fill="#1e3a8a">Menu Bar</text>
  <text x="162" y="35" font-size="11.3" fill="#475569">File    Edit    Selection    View    Build    Run    Help</text>

  <!-- 상단 중앙 팔레트 호출 검색창 -->
  <rect x="492" y="19" width="268" height="24" rx="12" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="626" y="35" text-anchor="middle" font-size="10.8" font-weight="700" fill="#2563eb">⌘/Ctrl+Shift+P  ·  명령 팔레트 호출</text>

  <!-- 우측 창 구획 토글 배지 -->
  <rect x="780" y="20" width="154" height="22" rx="6" fill="#dbeafe"/>
  <text x="857" y="35" text-anchor="middle" font-size="10.2" font-weight="700" fill="#1e40af">좌 · 하 · 우 보조창 개폐</text>


  <!-- ==================== 2. Activity Bar (좌측 아이콘 레일) ==================== -->
  <rect data-key="activitybar" x="12" y="58" width="66" height="368" rx="8" fill="#f5f3ff" stroke="#a78bfa" stroke-width="1.6"/>
  <text x="45" y="79" text-anchor="middle" font-size="10.8" font-weight="800" fill="#5b21b6">Activity</text>
  <text x="45" y="93" text-anchor="middle" font-size="10.3" font-weight="700" fill="#6d28d9">Bar</text>

  <rect x="23" y="108" width="44" height="32" rx="7" fill="#7c3aed"/>
  <text x="45" y="128" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff">탐색</text>

  <rect x="23" y="148" width="44" height="32" rx="7" fill="#ffffff" stroke="#c4b5fd"/>
  <text x="45" y="168" text-anchor="middle" font-size="10.5" fill="#5b21b6">검색</text>

  <rect x="23" y="188" width="44" height="32" rx="7" fill="#ffffff" stroke="#c4b5fd"/>
  <text x="45" y="208" text-anchor="middle" font-size="10.5" fill="#5b21b6">Git</text>

  <rect x="23" y="228" width="44" height="32" rx="7" fill="#ffffff" stroke="#c4b5fd"/>
  <text x="45" y="248" text-anchor="middle" font-size="10" fill="#5b21b6">디버그</text>

  <rect x="23" y="268" width="44" height="32" rx="7" fill="#ffffff" stroke="#c4b5fd"/>
  <text x="45" y="288" text-anchor="middle" font-size="10.5" fill="#5b21b6">확장</text>

  <rect x="23" y="382" width="44" height="30" rx="7" fill="#ede9fe" stroke="#c4b5fd"/>
  <text x="45" y="401" text-anchor="middle" font-size="10" font-weight="700" fill="#5b21b6">설정</text>


  <!-- ==================== 3. Left Side Bar (좌측 사이드 바) ==================== -->
  <g clip-path="url(#clipLeftSb)">
    <rect x="86" y="58" width="178" height="368" fill="#ffffff"/>
    <rect x="86" y="58" width="178" height="32" fill="#f1f5f9"/>
    <line x1="86" y1="90" x2="264" y2="90" stroke="#e2e8f0" stroke-width="1.2"/>
  </g>
  <rect data-key="leftsidebar sidebar" x="86" y="58" width="178" height="368" rx="8" fill="none" stroke="#94a3b8" stroke-width="1.6"/>
  <text x="98" y="79" font-size="12" font-weight="800" fill="#1e293b">Left Side Bar</text>
  <rect x="214" y="65" width="40" height="18" rx="9" fill="#e2e8f0"/>
  <text x="234" y="78" text-anchor="middle" font-size="9.8" font-weight="700" fill="#334155">좌측</text>

  <text x="98" y="110" font-size="10.5" font-weight="700" fill="#475569">프로젝트 파일 트리 · Git</text>

  <g font-family="'D2Coding', 'Consolas', monospace" font-size="10.8" fill="#334155">
    <text x="98" y="132" font-weight="700" fill="#334155">▼ C-TUTORIAL</text>
    <text x="110" y="152" fill="#64748b">▶ .vscode</text>
    <text x="122" y="171" fill="#64748b">tasks.json</text>
    <text x="122" y="190" fill="#64748b">launch.json</text>
    <rect x="94" y="200" width="162" height="23" rx="5" fill="#dbeafe"/>
    <text x="110" y="216" font-weight="700" fill="#1d4ed8">📄 hello.c</text>
    <text x="110" y="240" fill="#475569">📄 utils.h</text>
    <text x="110" y="260" fill="#64748b">⚙ hello.exe</text>
  </g>

  <!-- 좌측 하단 심볼 목차(Outline) -->
  <rect x="96" y="294" width="158" height="120" rx="7" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2"/>
  <text x="108" y="315" font-size="10.8" font-weight="800" fill="#334155">▼ 심볼 목차 (Outline)</text>
  <g font-family="'D2Coding', 'Consolas', monospace" font-size="10.5">
    <text x="116" y="338" fill="#2563eb" font-weight="700">ƒ main(void)</text>
    <text x="116" y="358" fill="#059669">ƒ print_msg()</text>
    <text x="116" y="378" fill="#64748b"># BUFFER_SIZE</text>
    <text x="116" y="398" fill="#64748b">v global_cnt</text>
  </g>


  <!-- ==================== 4. Editor Area (중앙 코드 편집 영역) ==================== -->
  <g clip-path="url(#clipEditor)">
    <rect x="272" y="58" width="476" height="238" fill="#0f172a"/>
    <rect x="272" y="58" width="476" height="32" fill="#1e293b"/>
  </g>
  <rect data-key="editorarea" x="272" y="58" width="476" height="238" rx="8" fill="none" stroke="#2563eb" stroke-width="2.2"/>

  <!-- 에디터 탭 줄 -->
  <rect x="278" y="63" width="106" height="27" rx="5" fill="#0f172a"/>
  <text x="331" y="80" text-anchor="middle" font-family="'D2Coding', 'Consolas', monospace" font-size="11" font-weight="700" fill="#93c5fd">hello.c  ×</text>
  <text x="424" y="80" text-anchor="middle" font-family="'D2Coding', 'Consolas', monospace" font-size="10.8" fill="#94a3b8">utils.h</text>
  <rect x="572" y="64" width="166" height="20" rx="10" fill="#1d4ed8"/>
  <text x="655" y="78" text-anchor="middle" font-size="10.5" font-weight="800" fill="#ffffff">Editor Area (편집 영역)</text>

  <!-- Breadcrumbs & Sticky Scroll (경로 탐색줄 · 상단 고정 스크롤) -->
  <rect data-key="sticky breadcrumbs" x="274" y="90" width="472" height="22" fill="#172554"/>
  <line x1="274" y1="112" x2="746" y2="112" stroke="#1e3a8a" stroke-width="1"/>
  <text x="284" y="105" font-family="'D2Coding', 'Consolas', monospace" font-size="10.2" fill="#93c5fd">src &gt; hello.c &gt; <tspan font-weight="700" fill="#fde68a">int main(void) {</tspan></text>
  <text x="738" y="105" text-anchor="end" font-size="9.8" font-weight="700" fill="#bfdbfe">Breadcrumbs · Sticky Scroll</text>

  <!-- 코드 줄 번호 + 중단점 + C 소스 코드 -->
  <g font-family="'D2Coding', 'Consolas', monospace" font-size="11.2">
    <text x="296" y="213" fill="#64748b">1</text>
    <text x="316" y="213" fill="#93c5fd">#include &lt;stdio.h&gt;</text>

    <text x="296" y="231" fill="#64748b">2</text>
    <text x="316" y="231" fill="#e2e8f0"><tspan fill="#c084fc">int</tspan> main(<tspan fill="#c084fc">void</tspan>) {</text>

    <!-- 3번 줄 중단점(Breakpoint) -->
    <circle cx="285" cy="246" r="4.3" fill="#ef4444"/>
    <rect x="310" y="237" width="426" height="19" rx="3" fill="#1e293b"/>
    <text x="296" y="250" fill="#e2e8f0">3</text>
    <text x="316" y="250" fill="#e2e8f0">    printf(<tspan fill="#86efac">"Hello, C!\n"</tspan>);</text>
    <text x="598" y="250" font-size="10" fill="#fca5a5">◀ 중단점(Breakpoint)</text>

    <text x="296" y="268" fill="#64748b">4</text>
    <text x="316" y="268" fill="#e2e8f0">    <tspan fill="#c084fc">return</tspan> <tspan fill="#fde68a">0</tspan>;</text>

    <text x="296" y="286" fill="#64748b">5</text>
    <text x="316" y="286" fill="#e2e8f0">}</text>
  </g>

  <!-- ==================== [플로팅 오버레이] Command Palette (명령 팔레트) ==================== -->
  <g filter="url(#paletteShadow)">
    <rect data-key="palette" x="322" y="117" width="376" height="80" rx="9" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
    <!-- 입력창 -->
    <rect x="332" y="124" width="356" height="24" rx="5" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.2"/>
    <text x="342" y="140" font-family="'D2Coding', 'Consolas', monospace" font-size="10.8" font-weight="700" fill="#5b21b6">&gt; C/C++: Build</text>
    <rect x="556" y="127" width="126" height="18" rx="9" fill="#7c3aed"/>
    <text x="619" y="139" text-anchor="middle" font-size="9.6" font-weight="800" fill="#ffffff">Command Palette</text>

    <!-- 자동완성 명령 목록 -->
    <rect x="332" y="152" width="356" height="20" rx="4" fill="#ede9fe"/>
    <text x="342" y="166" font-size="10.3" font-weight="700" fill="#4c1d95">⚙ C/C++: 활성 파일 빌드 및 디버그</text>
    <text x="678" y="166" text-anchor="end" font-family="'D2Coding', 'Consolas', monospace" font-size="10" font-weight="700" fill="#6d28d9">F5</text>

    <text x="342" y="187" font-size="10.1" fill="#64748b">📄 Preferences: 설정 열기 (JSON)</text>
    <text x="678" y="187" text-anchor="end" font-family="'D2Coding', 'Consolas', monospace" font-size="9.8" fill="#94a3b8">Ctrl+,</text>
  </g>


  <!-- ==================== 5. Drawer (하단 서랍) ==================== -->
  <g clip-path="url(#clipPanel)">
    <rect x="272" y="304" width="476" height="122" fill="#fff7ed"/>
    <rect x="272" y="304" width="476" height="28" fill="#ffedd5"/>
    <line x1="272" y1="332" x2="748" y2="332" stroke="#fed7aa" stroke-width="1.2"/>
  </g>
  <rect data-key="drawer panel" x="272" y="304" width="476" height="122" rx="8" fill="none" stroke="#f97316" stroke-width="1.8"/>
  <text x="284" y="323" font-size="12" font-weight="800" fill="#9a3412">Drawer (하단 서랍)</text>
  <text x="412" y="323" font-size="10.2" fill="#9a3412">문제(Problems)  ·  로그(Log Console)  ·  <tspan font-weight="800" text-decoration="underline">터미널(Terminal)</tspan></text>

  <!-- 좌측: Terminal (CLI 쉘) -->
  <rect data-key="terminal" x="282" y="339" width="242" height="77" rx="6" fill="#0f172a"/>
  <text x="292" y="354" font-size="9.6" font-weight="800" fill="#fde68a">▶ Terminal (명령줄 실행 · 표준 입출력)</text>
  <g font-family="'D2Coding', 'Consolas', monospace" font-size="10.2">
    <text x="292" y="372" fill="#94a3b8">$ <tspan fill="#e2e8f0">gcc hello.c -o hello.exe</tspan></text>
    <text x="292" y="389" fill="#94a3b8">$ <tspan fill="#e2e8f0">.\hello.exe</tspan></text>
    <text x="292" y="406" fill="#86efac" font-weight="700">Hello, C! <tspan fill="#64748b" font-weight="400">[Exit: 0]</tspan></text>
  </g>

  <!-- 우측: Log / Debug Console & Problems -->
  <rect data-key="logconsole problems" x="530" y="339" width="208" height="77" rx="6" fill="#1e293b"/>
  <text x="540" y="354" font-size="9.6" font-weight="800" fill="#93c5fd">▶ Log / Debug Console · Problems</text>
  <g font-family="'D2Coding', 'Consolas', monospace" font-size="9.8">
    <text x="540" y="372" fill="#cbd5e1">[Build] 0 errors, 0 warnings</text>
    <text x="540" y="389" fill="#c4b5fd">[Debug] Bp #1 hit: hello.c:3</text>
    <text x="540" y="406" fill="#67e8f9">[Log] LSP clangd indexed (12ms)</text>
  </g>


  <!-- ==================== 6. Right Side Bar (우측 사이드 바) ==================== -->
  <g clip-path="url(#clipRightSb)">
    <rect x="756" y="58" width="192" height="368" fill="#ffffff"/>
    <rect x="756" y="58" width="192" height="32" fill="#ede9fe"/>
    <line x1="756" y1="90" x2="948" y2="90" stroke="#ddd6fe" stroke-width="1.2"/>
  </g>
  <rect data-key="rightsidebar" x="756" y="58" width="192" height="368" rx="8" fill="none" stroke="#8b5cf6" stroke-width="1.8"/>
  <text x="768" y="79" font-size="12" font-weight="800" fill="#4c1d95">Right Side Bar</text>
  <rect x="898" y="65" width="40" height="18" rx="9" fill="#ddd6fe"/>
  <text x="918" y="78" text-anchor="middle" font-size="9.8" font-weight="700" fill="#4c1d95">우측</text>

  <text x="768" y="110" font-size="10.5" font-weight="700" fill="#5b21b6">✦ AI 에이전트 · 보조 뷰</text>

  <!-- 대화 카드 1 -->
  <rect x="768" y="120" width="168" height="48" rx="7" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="778" y="138" font-size="10.3" font-weight="700" fill="#334155">질문: 경고 원인 분석</text>
  <text x="778" y="156" font-size="10" fill="#64748b">반환형 누락 문제 설명해 줘</text>

  <!-- 대화 카드 2 -->
  <rect x="768" y="176" width="168" height="96" rx="7" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.2"/>
  <text x="778" y="195" font-size="10.5" font-weight="800" fill="#5b21b6">✦ AI 코드 분석 · 제안</text>
  <text x="778" y="214" font-size="10" fill="#4c1d95">main 함수의 종료 코드를</text>
  <text x="778" y="231" font-size="10" fill="#4c1d95">명시하도록 수정했습니다.</text>
  <rect x="778" y="242" width="148" height="20" rx="5" fill="#ede9fe"/>
  <text x="852" y="256" text-anchor="middle" font-size="9.8" font-weight="700" fill="#5b21b6">변경점 비교(Diff) · 적용</text>

  <!-- 우측 하단 기타 도킹 안내 -->
  <rect x="768" y="282" width="168" height="94" rx="7" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2"/>
  <text x="778" y="302" font-size="10.5" font-weight="800" fill="#334155">우측 도킹 활용 예시</text>
  <text x="778" y="322" font-size="10" fill="#64748b">· 마크다운 / 웹 미리보기</text>
  <text x="778" y="340" font-size="10" fill="#64748b">· 디버그 변수 · 메모리 창</text>
  <text x="778" y="358" font-size="10" fill="#64748b">· 속성 / 리소스 관리자</text>

  <!-- 프롬프트 입력줄 -->
  <rect x="768" y="386" width="168" height="28" rx="6" fill="#ffffff" stroke="#c4b5fd" stroke-width="1.2"/>
  <text x="778" y="404" font-size="10" fill="#94a3b8">질문 또는 명령 입력...</text>
  <text x="926" y="404" text-anchor="end" font-size="10.5" font-weight="800" fill="#7c3aed">↵</text>


  <!-- ==================== 7. Status Bar (최하단 상태 표시줄) ==================== -->
  <rect data-key="statusbar" x="12" y="434" width="936" height="34" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.6"/>
  <text x="28" y="455" font-size="12" font-weight="800" fill="#065f46">Status Bar</text>
  <text x="116" y="455" font-family="'D2Coding', 'Consolas', monospace" font-size="11" fill="#047857">⎇ main*   │   ✕ 0   ⚠ 0   │   빌드 준비 완료</text>
  <text x="932" y="455" text-anchor="end" font-family="'D2Coding', 'Consolas', monospace" font-size="11" font-weight="700" fill="#065f46">Ln 3, Col 28   │   UTF-8   │   CRLF   │   C17 (GCC)</text>
</svg>
