<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" font-family="'Pretendard', 'Malgun Gothic', 'Apple SD Gothic Neo', 'Nanum Gothic', sans-serif">
  <title>Rust 통합 툴체인(rustup · cargo · rustc · LLVM) 파이프라인</title>
  <desc>C의 gcc/Make, Java의 Gradle/Maven, Python의 pip/venv/pytest로 쪼개져 있던 개발 도구들을 rustup과 cargo 하나로 통합한 Rust 생태계 구조도입니다.</desc>

  <defs>
    <filter id="cpShadow" x="-3%" y="-4%" width="106%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <marker id="cpArr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M1,1.5 L9,5 L1,8.5 Z" fill="#475569"/>
    </marker>
    <marker id="cpArrOrange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M1,1.5 L9,5 L1,8.5 Z" fill="#ea580c"/>
    </marker>
  </defs>

  <rect width="960" height="440" rx="14" fill="#fcfcfa" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- ==================== 상단: rustup 툴체인 관리자 ==================== -->
  <g filter="url(#cpShadow)">
    <rect data-key="rustup-box" x="20" y="16" width="920" height="72" rx="11" fill="#0f172a" stroke="#334155" stroke-width="1.8"/>
    <rect x="36" y="30" width="110" height="44" rx="8" fill="#ea580c"/>
    <text x="91" y="49" text-anchor="middle" font-family="'D2Coding', monospace" font-size="14" font-weight="900" fill="#ffffff">rustup</text>
    <text x="91" y="65" text-anchor="middle" font-size="9.8" font-weight="700" fill="#ffedd5">툴체인 버전 관리자</text>

    <text x="164" y="44" font-size="12.5" font-weight="800" fill="#f8fafc">설치 한 번으로 컴파일러 · 패키지 매니저 · 포매터 · 린터 · 표준 문서를 일괄 관리</text>
    <text x="164" y="65" font-family="'D2Coding', monospace" font-size="10.8" fill="#93c5fd">stable(안정판) · nightly(실험판) 전환 │ 크로스 컴파일 타겟 추가(wasm32, aarch64, linux-gnu)</text>

    <rect x="772" y="28" width="152" height="48" rx="8" fill="#1e293b" stroke="#475569"/>
    <text x="848" y="47" text-anchor="middle" font-family="'D2Coding', monospace" font-size="10.5" font-weight="700" fill="#fde047">rustup update</text>
    <text x="848" y="65" text-anchor="middle" font-size="10" fill="#cbd5e1">최신 버전 원클릭 갱신</text>
  </g>

  <!-- ==================== 좌측: 프로젝트 소스 & 의존성 (Cargo.toml + crates.io) ==================== -->
  <g filter="url(#cpShadow)">
    <rect data-key="cargo-manifest" x="20" y="108" width="256" height="314" rx="12" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
    <rect x="20" y="108" width="256" height="38" rx="12" fill="#e0f2fe"/>
    <rect x="20" y="132" width="256" height="14" fill="#e0f2fe"/>
    <text x="148" y="132" text-anchor="middle" font-size="13" font-weight="800" fill="#0c4a6e">① 프로젝트 선언 · 의존성</text>

    <rect x="34" y="158" width="228" height="84" rx="8" fill="#f8fafc" stroke="#bae6fd"/>
    <text x="46" y="177" font-family="'D2Coding', monospace" font-size="11.5" font-weight="800" fill="#0369a1">Cargo.toml <tspan font-family="'Pretendard', sans-serif" font-size="10" fill="#475569">(패키지 설계서)</tspan></text>
    <text x="46" y="196" font-family="'D2Coding', monospace" font-size="10.2" fill="#334155">[package] edition = "2021"</text>
    <text x="46" y="213" font-family="'D2Coding', monospace" font-size="10.2" fill="#334155">[dependencies] serde = "1.0"</text>
    <text x="46" y="231" font-size="9.8" fill="#64748b">※ Cargo.lock이 정확한 하위 버전을 고정</text>

    <rect x="34" y="252" width="228" height="72" rx="8" fill="#f0fdf4" stroke="#86efac"/>
    <text x="46" y="272" font-family="'D2Coding', monospace" font-size="11.5" font-weight="800" fill="#065f46">crates.io <tspan font-family="'Pretendard', sans-serif" font-size="10" fill="#047857">(공식 패키지 저장소)</tspan></text>
    <text x="46" y="292" font-size="10.3" fill="#334155">· Python PyPI(pip)처럼 명령 한 줄 추가</text>
    <text x="46" y="310" font-family="'D2Coding', monospace" font-size="10.3" font-weight="700" fill="#047857">$ cargo add serde tokio</text>

    <rect x="34" y="334" width="228" height="74" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="46" y="354" font-family="'D2Coding', monospace" font-size="11.2" font-weight="800" fill="#1e293b">src/ <tspan font-family="'Pretendard', sans-serif" font-size="10" fill="#475569">(헤더 .h 분리 없음!)</tspan></text>
    <text x="46" y="373" font-family="'D2Coding', monospace" font-size="10.2" fill="#334155">├─ main.rs  (실행 바이너리 진입점)</text>
    <text x="46" y="391" font-family="'D2Coding', monospace" font-size="10.2" fill="#334155">└─ lib.rs   (라이브러리 크레이트 루트)</text>
  </g>

  <line x1="276" y1="265" x2="314" y2="265" stroke="#ea580c" stroke-width="2.4" marker-end="url(#cpArrOrange)"/>

  <!-- ==================== 중앙: Cargo 지휘 본부 & rustc/LLVM ==================== -->
  <g filter="url(#cpShadow)">
    <rect data-key="rustc-llvm" x="320" y="108" width="336" height="314" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2.2"/>
    <rect x="320" y="108" width="336" height="38" rx="12" fill="#ffedd5"/>
    <rect x="320" y="132" width="336" height="14" fill="#ffedd5"/>
    <text x="488" y="132" text-anchor="middle" font-size="13" font-weight="800" fill="#9a3412">② Cargo 오케스트레이터 &amp; 컴파일</text>

    <!-- Cargo 명령 4총사 -->
    <rect x="336" y="156" width="304" height="114" rx="8" fill="#ffffff" stroke="#fdba74"/>
    <text x="348" y="175" font-size="11" font-weight="800" fill="#c2410c">통합 워크플로우 명령어 (Makefile + pytest + javadoc 대체)</text>
    <g font-family="'D2Coding', monospace" font-size="10.4">
      <text x="348" y="196" fill="#0f172a"><tspan font-weight="800" fill="#ea580c">cargo check</tspan>  : 기계어 생성 생략 · 초고속 문법/빌림 검사</text>
      <text x="348" y="215" fill="#0f172a"><tspan font-weight="800" fill="#2563eb">cargo run</tspan>    : 의존성 다운로드 + 컴파일 + 즉시 실행</text>
      <text x="348" y="234" fill="#0f172a"><tspan font-weight="800" fill="#059669">cargo test</tspan>   : 코드 내 #[test] 단위·통합 테스트 일괄 수행</text>
      <text x="348" y="253" fill="#0f172a"><tspan font-weight="800" fill="#7c3aed">cargo clippy</tspan> : 실무 안티패턴·성능 개선 린트 정밀 진단</text>
    </g>

    <!-- 내부 컴파일 3단계 -->
    <rect x="336" y="282" width="304" height="126" rx="8" fill="#1e293b"/>
    <text x="488" y="302" text-anchor="middle" font-size="11" font-weight="800" fill="#fde047">내부 컴파일 엔진 (rustc ➔ LLVM ➔ Linker)</text>

    <rect x="348" y="314" width="84" height="58" rx="6" fill="#334155" stroke="#60a5fa"/>
    <text x="390" y="334" text-anchor="middle" font-size="10.2" font-weight="800" fill="#93c5fd">HIR / MIR</text>
    <text x="390" y="350" text-anchor="middle" font-size="9.3" fill="#e2e8f0">타입 추론 및</text>
    <text x="390" y="363" text-anchor="middle" font-size="9.3" font-weight="700" fill="#fde047">소유권·빌림 검증</text>

    <line x1="432" y1="343" x2="444" y2="343" stroke="#94a3b8" stroke-width="1.6"/>

    <rect x="446" y="314" width="84" height="58" rx="6" fill="#334155" stroke="#34d399"/>
    <text x="488" y="334" text-anchor="middle" font-size="10.2" font-weight="800" fill="#6ee7b7">LLVM IR</text>
    <text x="488" y="350" text-anchor="middle" font-size="9.3" fill="#e2e8f0">제로 코스트</text>
    <text x="488" y="363" text-anchor="middle" font-size="9.3" fill="#e2e8f0">기계어 최적화</text>

    <line x1="530" y1="343" x2="542" y2="343" stroke="#94a3b8" stroke-width="1.6"/>

    <rect x="544" y="314" width="84" height="58" rx="6" fill="#334155" stroke="#f472b6"/>
    <text x="586" y="334" text-anchor="middle" font-size="10.2" font-weight="800" fill="#f9a8d4">OS Linker</text>
    <text x="586" y="350" text-anchor="middle" font-size="9.3" fill="#e2e8f0">MSVC / ld 결합</text>
    <text x="586" y="363" text-anchor="middle" font-size="9.3" fill="#e2e8f0">실행파일 완성</text>

    <text x="488" y="394" text-anchor="middle" font-size="9.6" fill="#cbd5e1">※ Windows에서 Visual C++ 빌드 도구를 설치하는 이유 = 마지막 Linker 제공!</text>
  </g>

  <line x1="656" y1="265" x2="694" y2="265" stroke="#475569" stroke-width="2.4" marker-end="url(#cpArr)"/>

  <!-- ==================== 우측: 빌드 산출물 (target/) ==================== -->
  <g filter="url(#cpShadow)">
    <rect data-key="cargo-out" x="700" y="108" width="240" height="314" rx="12" fill="#ffffff" stroke="#475569" stroke-width="2"/>
    <rect x="700" y="108" width="240" height="38" rx="12" fill="#f1f5f9"/>
    <rect x="700" y="132" width="240" height="14" fill="#f1f5f9"/>
    <text x="820" y="132" text-anchor="middle" font-size="13" font-weight="800" fill="#1e293b">③ 산출물 (target/)</text>

    <rect x="714" y="158" width="212" height="76" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="726" y="178" font-family="'D2Coding', monospace" font-size="11" font-weight="800" fill="#1d4ed8">target/debug/</text>
    <text x="726" y="197" font-size="10.2" fill="#334155">· 기본 빌드 (빠른 컴파일 속도 우선)</text>
    <text x="726" y="214" font-size="10.2" fill="#334155">· 디버그 심볼 + 정수 오버플로우 검사 포함</text>

    <rect x="714" y="244" width="212" height="84" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
    <text x="726" y="264" font-family="'D2Coding', monospace" font-size="11" font-weight="800" fill="#b45309">target/release/ <tspan font-size="9.5">(--release)</tspan></text>
    <text x="726" y="283" font-size="10.2" fill="#334155">· 배포용 공격적 LLVM 인라이닝·최적화</text>
    <text x="726" y="300" font-size="10.2" font-weight="700" fill="#92400e">· VM이나 런타임 없이 단독 실행(.exe)</text>
    <text x="726" y="317" font-size="9.8" fill="#78350f">· 벤치마크 측정은 반드시 --release로!</text>

    <rect x="714" y="338" width="212" height="70" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="4 3"/>
    <text x="726" y="358" font-size="10.6" font-weight="800" fill="#334155">형상관리(.gitignore) 자동 처리</text>
    <text x="726" y="376" font-size="10" fill="#475569">cargo new 생성 시 /target 폴더가</text>
    <text x="726" y="393" font-size="10" fill="#475569">기본 .gitignore에 자동 등록됨</text>
  </g>
</svg>
