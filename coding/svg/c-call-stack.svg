<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" font-family="'Pretendard', 'Malgun Gothic', 'Apple SD Gothic Neo', 'Nanum Gothic', sans-serif">
  <title>콜 스택(Call Stack)의 LIFO 동작 원리와 재귀 호출 스택 오버플로우</title>
  <desc>좌측에는 함수 중첩 호출 시 스택 프레임(복귀 주소·매개변수·지역변수)이 Push되고 return 시 역순(LIFO)으로 Pop되는 과정을, 우측에는 탈출 조건 없는 재귀 호출 시 스택 한계를 넘어 발생하는 Stack Overflow 런타임 에러를 도식화했습니다.</desc>

  <defs>
    <filter id="csShadow" x="-3%" y="-4%" width="106%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <marker id="csArrBlue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M1,1.5 L9,5 L1,8.5 Z" fill="#2563eb"/>
    </marker>
    <marker id="csArrGreen" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M1,1.5 L9,5 L1,8.5 Z" fill="#059669"/>
    </marker>
    <marker id="csArrRed" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M1,1.5 L9,5 L1,8.5 Z" fill="#dc2626"/>
    </marker>
    <clipPath id="clipCsLeft"><rect x="14" y="14" width="568" height="412" rx="12"/></clipPath>
    <clipPath id="clipCsRight"><rect x="598" y="14" width="348" height="412" rx="12"/></clipPath>
  </defs>

  <rect width="960" height="440" rx="14" fill="#fcfcfa" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- ==================== [LEFT] 콜 스택 Push / Pop (LIFO) ==================== -->
  <g clip-path="url(#clipCsLeft)" filter="url(#csShadow)">
    <rect x="14" y="14" width="568" height="412" fill="#ffffff"/>
    <rect x="14" y="14" width="568" height="38" fill="#dbeafe"/>
  </g>
  <rect data-key="cs-lifo" x="14" y="14" width="568" height="412" rx="12" fill="none" stroke="#3b82f6" stroke-width="1.8"/>
  <text x="30" y="38" font-size="14" font-weight="800" fill="#1e3a8a">콜 스택 (Call Stack) — 선입후출(LIFO) 메모리 구조</text>
  <text x="566" y="38" text-anchor="end" font-size="10.8" font-weight="700" fill="#1d4ed8">main() ➔ calc() ➔ add()</text>

  <!-- 스택 프레임 3요소 안내 배지 -->
  <rect data-key="cs-frame" x="28" y="62" width="540" height="44" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="42" y="81" font-size="11.2" font-weight="800" fill="#1e3a8a">스택 프레임(Stack Frame)에 저장되는 3가지:</text>
  <text x="42" y="98" font-size="10.5" fill="#334155">① 끝난 뒤 돌아갈 <tspan font-weight="700" fill="#1d4ed8">복귀 주소(Return Address)</tspan>   ② 전달받은 <tspan font-weight="700" fill="#1d4ed8">매개변수</tspan>   ③ 함수 내 <tspan font-weight="700" fill="#1d4ed8">지역변수</tspan></text>

  <!-- 4단계 스택 타임라인 (아래에서 위로 쌓이는 직관적 컨테이너) -->
  <!-- Stage 1 -->
  <text x="86" y="128" text-anchor="middle" font-size="11" font-weight="800" fill="#334155">① main 시작</text>
  <rect x="32" y="138" width="108" height="218" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="4 3"/>
  <rect x="38" y="298" width="96" height="52" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="86" y="320" text-anchor="middle" font-size="11.5" font-weight="800" fill="#1e3a8a">main()</text>
  <text x="86" y="338" text-anchor="middle" font-family="'D2Coding', monospace" font-size="9.8" fill="#334155">x=3, y=7</text>

  <!-- 화살표 1->2 -->
  <line x1="143" y1="246" x2="165" y2="246" stroke="#2563eb" stroke-width="1.8" marker-end="url(#csArrBlue)"/>
  <text x="154" y="236" text-anchor="middle" font-size="9.5" font-weight="700" fill="#2563eb">Push</text>

  <!-- Stage 2 -->
  <text x="224" y="128" text-anchor="middle" font-size="11" font-weight="800" fill="#1d4ed8">② calc 호출</text>
  <rect x="170" y="138" width="108" height="218" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="4 3"/>
  <rect x="176" y="238" width="96" height="54" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/>
  <text x="224" y="259" text-anchor="middle" font-size="11.5" font-weight="800" fill="#4c1d95">calc()</text>
  <text x="224" y="277" text-anchor="middle" font-size="9.5" fill="#5b21b6">복귀: main:5행</text>
  <rect x="176" y="298" width="96" height="52" rx="6" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="224" y="320" text-anchor="middle" font-size="11" font-weight="700" fill="#1e3a8a">main()</text>
  <text x="224" y="338" text-anchor="middle" font-size="9.5" fill="#64748b">대기 중</text>

  <!-- 화살표 2->3 -->
  <line x1="281" y1="246" x2="303" y2="246" stroke="#2563eb" stroke-width="1.8" marker-end="url(#csArrBlue)"/>
  <text x="292" y="236" text-anchor="middle" font-size="9.5" font-weight="700" fill="#2563eb">Push</text>

  <!-- Stage 3 -->
  <text x="362" y="128" text-anchor="middle" font-size="11" font-weight="800" fill="#6d28d9">③ add 호출</text>
  <rect data-key="cs-push" x="308" y="138" width="108" height="218" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="4 3"/>
  <rect x="314" y="176" width="96" height="56" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/>
  <text x="362" y="198" text-anchor="middle" font-size="11.5" font-weight="800" fill="#92400e">add()</text>
  <text x="362" y="216" text-anchor="middle" font-size="9.5" fill="#b45309">복귀: calc:11행</text>
  <rect x="314" y="238" width="96" height="54" rx="6" fill="#ede9fe" stroke="#c4b5fd"/>
  <text x="362" y="259" text-anchor="middle" font-size="11" font-weight="700" fill="#4c1d95">calc()</text>
  <text x="362" y="277" text-anchor="middle" font-size="9.5" fill="#64748b">대기 중</text>
  <rect x="314" y="298" width="96" height="52" rx="6" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="362" y="320" text-anchor="middle" font-size="11" font-weight="700" fill="#1e3a8a">main()</text>
  <text x="362" y="338" text-anchor="middle" font-size="9.5" fill="#64748b">대기 중</text>

  <!-- 화살표 3->4 -->
  <line x1="419" y1="246" x2="441" y2="246" stroke="#059669" stroke-width="1.8" marker-end="url(#csArrGreen)"/>
  <text x="430" y="236" text-anchor="middle" font-size="9.5" font-weight="700" fill="#059669">Pop</text>

  <!-- Stage 4 -->
  <text x="504" y="128" text-anchor="middle" font-size="11" font-weight="800" fill="#065f46">④ return 복귀</text>
  <rect data-key="cs-pop" x="446" y="138" width="116" height="218" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="4 3"/>
  <rect x="454" y="176" width="100" height="56" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-dasharray="3 3"/>
  <text x="504" y="201" text-anchor="middle" font-size="10.2" fill="#94a3b8">add 소멸됨</text>
  <text x="504" y="217" text-anchor="middle" font-size="9.5" fill="#059669">▼ 값 반환</text>
  <rect x="454" y="238" width="100" height="54" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-dasharray="3 3"/>
  <text x="504" y="262" text-anchor="middle" font-size="10.2" fill="#94a3b8">calc 소멸됨</text>
  <text x="504" y="278" text-anchor="middle" font-size="9.5" fill="#059669">▼ 값 반환</text>
  <rect x="454" y="298" width="100" height="52" rx="6" fill="#ecfdf5" stroke="#10b981" stroke-width="1.8"/>
  <text x="504" y="320" text-anchor="middle" font-size="11.5" font-weight="800" fill="#065f46">main() 재개</text>
  <text x="504" y="338" text-anchor="middle" font-size="9.8" font-weight="700" fill="#047857">결과 수신 완료</text>

  <!-- 하단 핵심 요약 -->
  <rect x="28" y="368" width="540" height="44" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="298" y="387" text-anchor="middle" font-size="11" font-weight="700" fill="#1e293b">가장 나중에 호출된 함수(add)가 가장 먼저 끝나고 빠져나오는 선입후출(LIFO) 구조</text>
  <text x="298" y="404" text-anchor="middle" font-size="10.3" fill="#64748b">함수가 return 되는 순간 그 함수의 스택 프레임(지역변수)은 즉시 회수됩니다.</text>


  <!-- ==================== [RIGHT] 재귀 호출과 Stack Overflow ==================== -->
  <g clip-path="url(#clipCsRight)" filter="url(#csShadow)">
    <rect x="598" y="14" width="348" height="412" fill="#fffafa"/>
    <rect x="598" y="14" width="348" height="38" fill="#fee2e2"/>
  </g>
  <rect data-key="cs-overflow" x="598" y="14" width="348" height="412" rx="12" fill="none" stroke="#ef4444" stroke-width="1.8"/>
  <text x="614" y="38" font-size="14" font-weight="800" fill="#991b1b">재귀(Recursive)와 Stack Overflow</text>

  <!-- 재귀 코드 스니펫 -->
  <rect data-key="cs-rec" x="614" y="62" width="316" height="68" rx="7" fill="#0f172a"/>
  <g font-family="'D2Coding', Consolas, monospace" font-size="10.5">
    <text x="626" y="81" fill="#e2e8f0"><tspan fill="#c084fc">int</tspan> fact(<tspan fill="#c084fc">int</tspan> n) {</text>
    <text x="626" y="99" fill="#86efac">  if (n &lt;= 1) return 1; // 필수 탈출 조건!</text>
    <text x="626" y="117" fill="#fde68a">  return n * fact(n - 1); }</text>
  </g>

  <!-- 무한 누적 스택 프레임 -->
  <text x="772" y="149" text-anchor="middle" font-size="10.8" font-weight="700" fill="#7f1d1d">탈출 조건 누락·오류 시 반환 없이 프레임 무한 누적</text>

  <rect x="634" y="158" width="276" height="28" rx="5" fill="#fee2e2" stroke="#fca5a5"/>
  <text x="772" y="176" text-anchor="middle" font-family="'D2Coding', monospace" font-size="10.8" font-weight="700" fill="#991b1b">fact(10000) ➔ fact(9999) ...</text>

  <rect x="634" y="192" width="276" height="28" rx="5" fill="#fecaca" stroke="#f87171"/>
  <text x="772" y="210" text-anchor="middle" font-family="'D2Coding', monospace" font-size="10.8" font-weight="700" fill="#991b1b">fact(9998) ➔ fact(9997) ...</text>

  <rect x="634" y="226" width="276" height="28" rx="5" fill="#fca5a5" stroke="#ef4444"/>
  <text x="772" y="244" text-anchor="middle" font-family="'D2Coding', monospace" font-size="10.8" font-weight="700" fill="#7f1d1d">... 수만 개 스택 프레임 누적 ...</text>

  <line x1="772" y1="256" x2="772" y2="282" stroke="#dc2626" stroke-width="2.4" marker-end="url(#csArrRed)"/>

  <!-- 한계선 돌파 -->
  <line x1="614" y1="290" x2="930" y2="290" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4"/>
  <rect x="688" y="280" width="168" height="20" rx="10" fill="#dc2626"/>
  <text x="772" y="294" text-anchor="middle" font-size="10" font-weight="800" fill="#ffffff">스택 할당 한계선 돌파 (1~8MB)</text>

  <!-- 에러 경고 박스 -->
  <rect x="614" y="312" width="316" height="100" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.6"/>
  <text x="772" y="335" text-anchor="middle" font-size="12.5" font-weight="800" fill="#b91c1c">✕ Stack Overflow 발생!</text>
  <text x="772" y="356" text-anchor="middle" font-size="10.8" font-weight="700" fill="#7f1d1d">문법 오류(Syntax Error)가 아닌 런타임 에러</text>
  <text x="772" y="376" text-anchor="middle" font-size="10.3" fill="#991b1b">컴파일은 정상 통과하지만 실행 도중 메모리가 넘쳐</text>
  <text x="772" y="394" text-anchor="middle" font-size="10.3" fill="#991b1b">OS가 프로그램을 강제 종료시킵니다.</text>
</svg>
