  <article>
    <style>
      /* ==========================================
         홍보 페이지 전용 독립 스타일 (공통 CSS 규칙 차단 및 초기화)
         ========================================== */
      #promo-page-wrapper {
        font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Malgun Gothic', sans-serif !important;
        color: #0f172a;
        line-height: 1.5;
        padding: 20px 4px 80px;
        box-sizing: border-box;
      }

      #promo-page-wrapper *,
      #promo-page-wrapper *::before,
      #promo-page-wrapper *::after {
        box-sizing: border-box;
      }

      /* 공통 CSS 자동 번호 매김(h1::before, h2::before), 문단 들여쓰기(p::before), a 밑줄 등 완전 차단 */
      #promo-page-wrapper h1,
      #promo-page-wrapper h2,
      #promo-page-wrapper h3 {
        counter-increment: none !important;
        counter-reset: none !important;
        border: none !important;
        margin: 0 !important;
        padding: 0 !important;
        width: auto !important;
        font-family: inherit !important;
        clear: none !important;
      }

      #promo-page-wrapper h1::before,
      #promo-page-wrapper h2::before,
      #promo-page-wrapper h3::before,
      #promo-page-wrapper p::before {
        content: none !important;
        display: none !important;
      }

      #promo-page-wrapper p {
        margin: 0;
        padding: 0;
      }

      #promo-page-wrapper a,
      #promo-page-wrapper a:visited,
      #promo-page-wrapper a:hover {
        text-decoration: none;
        font-weight: inherit;
      }

      /* 공통 document.js가 주입하는 문서 상단 타이틀바(#title-container) 숨김 */
      body:has(#promo-page-wrapper) #title-container {
        display: none !important;
      }

      /* ==========================================
         우상단 Float Sticky 보기 전환 토글 버튼 (아이콘 보기 <-> 카드 보기)
         ========================================== */
      .promo-floating-view-toggle {
        position: sticky;
        top: 14px;
        float: right;
        z-index: 120;
        margin: 0 0 10px 12px;
      }

      .promo-view-toggle-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        height: 40px;
        padding: 0 14px;
        border-radius: 999px;
        border: 1px solid #cbd5e1;
        background: rgba(255, 255, 255, 0.96);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        color: #1e293b;
        font-size: 0.85rem;
        font-weight: 800;
        font-family: inherit;
        cursor: pointer;
        box-shadow: 0 4px 14px rgba(15, 23, 42, 0.12);
        transition: background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease, transform 0.18s ease, box-shadow 0.2s ease;
      }

      .promo-view-toggle-btn:hover {
        background: #2563eb;
        border-color: #2563eb;
        color: #ffffff;
        transform: translateY(-1px);
        box-shadow: 0 6px 18px rgba(37, 99, 235, 0.28);
      }

      .promo-view-toggle-btn .material-symbols-outlined {
        font-size: 20px;
      }

      /* ==========================================
         아이콘 보기 (Icon View - 기본 모드)
         ========================================== */
      .promo-icon-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(112px, 1fr));
        gap: 14px;
        margin: 10px 0 16px 0;
      }

      .promo-icon-item {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        gap: 9px;
        padding: 16px 10px 14px;
        border-radius: 14px;
        background: #ffffff;
        border: 1px solid #e2e8f0;
        box-shadow: 0 2px 6px rgba(15, 23, 42, 0.03);
        cursor: pointer;
        user-select: none;
        text-align: center;
        transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease, background-color 0.18s ease;
      }

      .promo-icon-item:hover {
        transform: translateY(-3px);
        box-shadow: 0 8px 18px rgba(37, 99, 235, 0.11);
        border-color: #93c5fd;
        background: #f8fafc;
      }

      .promo-icon-box {
        width: 58px;
        height: 58px;
        border-radius: 14px;
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        flex-shrink: 0;
        padding: 8px;
        box-sizing: border-box;
      }

      .promo-icon-box img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        display: block;
      }

      .promo-icon-fallback {
        font-size: 28px !important;
        color: #2563eb;
      }

      .promo-icon-label {
        font-size: 0.88rem;
        font-weight: 700;
        color: #1e293b;
        line-height: 1.3;
        width: 100%;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
        text-overflow: ellipsis;
        word-break: keep-all;
      }

      .promo-icon-item:hover .promo-icon-label {
        color: #2563eb;
      }

      /* ==========================================
         섹션 헤더 (Sticky & 펼치기/접기 애니메이션)
         ========================================== */
      .promo-section {
        margin-bottom: 28px;
      }

      .promo-section-header {
        position: sticky;
        top: 0;
        z-index: 40;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 12px 18px;
        margin: 0 0 6px 0;
        background: rgba(255, 255, 255, 0.94);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border: 1px solid #e2e8f0;
        border-radius: 12px;
        box-shadow: 0 2px 10px rgba(15, 23, 42, 0.05);
        cursor: pointer;
        user-select: none;
        transition: background-color 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
      }

      .promo-section-header:hover {
        background: rgba(248, 250, 252, 0.98);
        border-color: #93c5fd;
        box-shadow: 0 4px 14px rgba(37, 99, 235, 0.09);
      }

      .promo-section-heading {
        margin: 0 !important;
        padding: 0 !important;
        border: none !important;
        width: auto !important;
        font-size: 1.45rem !important;
        font-weight: 800 !important;
        color: #0f172a !important;
        line-height: 1.3 !important;
      }

      .promo-section-chevron {
        font-size: 26px !important;
        color: #475569;
        transition: transform 0.32s cubic-bezier(0.4, 0, 0.2, 1), color 0.2s ease;
        flex-shrink: 0;
        margin-right: 120px;
      }

      .promo-section-header:hover .promo-section-chevron {
        color: #2563eb;
      }

      .promo-section.collapsed .promo-section-chevron {
        transform: rotate(-90deg);
      }

      .promo-section-body {
        display: grid;
        grid-template-rows: 1fr;
        opacity: 1;
        transition: grid-template-rows 0.35s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.25s ease;
      }

      .promo-section.collapsed .promo-section-body {
        grid-template-rows: 0fr;
        opacity: 0;
        pointer-events: none;
      }

      .promo-section-inner {
        overflow: hidden;
        min-height: 0;
        padding: 4px 2px;
      }

      .promo-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
        gap: 20px;
        margin: 12px 0 16px 0;
      }

      .promo-card {
        background: #ffffff;
        border: 1px solid #e2e8f0;
        border-radius: 14px;
        padding: 22px 24px;
        box-shadow: 0 2px 8px rgba(15, 23, 42, 0.04);

        gap: 12px;
        cursor: pointer;
        position: relative;

      .promo-card:hover {
        transform: translateY(-3px);
        box-shadow: 0 8px 20px rgba(37, 99, 235, 0.1);
        border-color: #93c5fd;
      }

      .promo-card-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }

      .promo-card-title-wrap {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
      }

      .promo-tool-icon {
        width: 28px;
        height: 28px;
        object-fit: contain;
        flex-shrink: 0;
        border-radius: 6px;
      }

      .promo-card-title {
        font-size: 1.2rem;
        font-weight: 800;
        color: #1e293b;
        margin: 0;
        line-height: 1.3;
      }

      .promo-card-title a {
        color: inherit;
        text-decoration: none;
        font-weight: 800;
      }

      .promo-card-title a:hover {
        color: #2563eb;
        text-decoration: none;
      }

      .promo-card-actions {
        display: flex;
        align-items: center;
        gap: 6px;
        flex-shrink: 0;
      }

      .promo-card-badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 32px;
        height: 32px;
        padding: 0;
        box-sizing: border-box;
        border-radius: 8px;
        background-color: #eff6ff;
        color: #2563eb;
        flex-shrink: 0;
        text-decoration: none;
        transition: background-color 0.2s ease, color 0.2s ease, transform 0.15s ease;
      }

      .promo-card-badge:hover {
        background-color: #2563eb;
        color: #ffffff;
        transform: translateY(-1px);
        text-decoration: none;
      }

      .promo-card-badge.promo-card-badge-github {
        background-color: #f1f5f9;
        color: #1e293b;
      }

      .promo-card-badge.promo-card-badge-github:hover {
        background-color: #0f172a;
        color: #ffffff;
      }

      .promo-card-badge .material-symbols-outlined {
        font-size: 19px;
      }

      .promo-github-icon {
        display: block;
        flex-shrink: 0;
      }

      .promo-card-url-box {
        background-color: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 8px;
        padding: 8px 12px;
        font-size: 0.85rem;
        word-break: break-all;
        line-height: 1.4;
      }

      .promo-card-url {
        color: #2563eb;
        font-family: var(--font-monospace);
        font-weight: 600;
        text-decoration: underline;
        text-underline-offset: 0.2em;
      }

      .promo-card-url:visited {
        color: #1d4ed8;
      }

      .promo-card-url:hover {
        color: #dc2626;
      }

      .promo-card-desc {
        margin: 4px 0 0 0;
        font-size: 0.95rem;
        color: #334155;
        line-height: 1.65;
        flex-grow: 1;
      }

      .promo-card-desc::before {
        display: none;
      }

      .promo-preview-img {
        width: 100%;
        border-radius: 8px;
        margin-top: 8px;
        border: 1px solid #e2e8f0;
        cursor: zoom-in;
        transition: opacity 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
        display: block;
      }

      .promo-preview-img:hover {
        opacity: 0.95;
        box-shadow: 0 4px 12px rgba(15, 23, 42, 0.12);
      }

      .promo-card-footer-hint {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 4px;
        font-size: 0.76rem;
        color: #64748b;
        margin-top: 2px;
        user-select: none;
      }

      .promo-card:hover .promo-card-footer-hint {
        color: #2563eb;
      }

      /* ==========================================
         카드 상세 정보 팝업 (Detail Modal)
         ========================================== */
      .promo-detail-overlay {
        position: fixed;
        inset: 0;
        background-color: rgba(15, 23, 42, 0.6);
        backdrop-filter: blur(3px);
        -webkit-backdrop-filter: blur(3px);
        z-index: 15000;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 20px;
        box-sizing: border-box;
      }

      .promo-detail-overlay.active {
        display: flex;
      }

      .promo-detail-dialog {
        background: #ffffff;
        border-radius: 16px;
        width: min(680px, 94vw);
        max-height: 86vh;
        display: flex;
        flex-direction: column;
        box-shadow: 0 20px 50px rgba(15, 23, 42, 0.28);
        overflow: hidden;
        animation: promoModalFadeIn 0.2s ease-out;
      }

      @keyframes promoModalFadeIn {
        from {
          opacity: 0;
          transform: translateY(10px) scale(0.98);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      .promo-detail-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 18px 24px;
        border-bottom: 1px solid #e2e8f0;
        background: #f8fafc;
      }

      .promo-detail-title-group {
        display: flex;
        align-items: center;
        gap: 12px;
        min-width: 0;
        flex-wrap: wrap;
      }

      .promo-detail-icon {
        width: 34px;
        height: 34px;
        object-fit: contain;
        border-radius: 8px;
        flex-shrink: 0;
      }

      .promo-detail-title {
        font-size: 1.35rem;
        font-weight: 800;
        color: #0f172a;
        margin: 0;
      }

      .promo-detail-project-badge {
        font-size: 0.78rem;
        font-weight: 700;
        color: #1d4ed8;
        background: #dbeafe;
        padding: 2px 10px;
        border-radius: 999px;
      }

      .promo-detail-close {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        border: 1px solid #cbd5e1;
        background: #ffffff;
        color: #475569;
        font-size: 22px;
        line-height: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        flex-shrink: 0;
        padding: 0;
        transition: background-color 0.2s ease, color 0.2s ease;
      }

      .promo-detail-close:hover {
        background: #fee2e2;
        border-color: #fca5a5;
        color: #dc2626;
      }

      .promo-detail-body {
        padding: 22px 24px 28px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 20px;
      }

      .promo-detail-links-bar {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      .promo-detail-link-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 38px;
        height: 38px;
        padding: 0;
        border-radius: 10px;
        background: #eff6ff;
        color: #2563eb !important;
        text-decoration: none !important;
        transition: background-color 0.2s ease, color 0.2s ease, transform 0.15s ease;
      }

      .promo-detail-link-btn:hover {
        background: #2563eb;
        color: #ffffff !important;
        transform: translateY(-1px);
      }

      .promo-detail-link-btn.github-btn {
        background: #f1f5f9;
        color: #1e293b !important;
      }

      .promo-detail-link-btn.github-btn:hover {
        background: #0f172a;
        color: #ffffff !important;
      }

      .promo-detail-link-btn .material-symbols-outlined {
        font-size: 20px;
      }

      .promo-detail-section {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .promo-detail-section-title {
        font-size: 0.95rem;
        font-weight: 800;
        color: #1e293b;
        display: flex;
        align-items: center;
        gap: 6px;
        margin: 0;
        padding-bottom: 6px;
        border-bottom: 1px solid #f1f5f9;
      }

      .promo-detail-desc-box {
        font-size: 0.95rem;
        color: #334155;
        line-height: 1.7;
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 10px;
        padding: 12px 16px;
      }

      .promo-tech-chips {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .promo-tech-chip {
        font-size: 0.84rem;
        font-weight: 600;
        color: #0f172a;
        background: #f1f5f9;
        border: 1px solid #cbd5e1;
        padding: 4px 12px;
        border-radius: 999px;
      }

      .promo-detail-list {
        margin: 0 !important;
        padding-left: 20px !important;

      }

        margin-bottom: 6px !important;
        line-height: 1.6 !important;
      }

      .promo-detail-list li::marker {

      }

      .promo-changelog-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .promo-changelog-item {
        display: flex;
        align-items: baseline;
        gap: 10px;
        font-size: 0.9rem;
        line-height: 1.55;
        padding: 8px 12px;
        background: #f8fafc;
        border-left: 3px solid #3b82f6;
        border-radius: 4px 8px 8px 4px;
      }

      .promo-changelog-date {
        font-family: var(--font-monospace);
        font-size: 0.82rem;
        font-weight: 700;
        color: #1d4ed8;
        white-space: nowrap;
        flex-shrink: 0;
      }

      .promo-changelog-content {
        color: #334155;
      }

      /* ==========================================
         대표이미지 크게보기 모달 (Lightbox)
         ========================================== */
      .promo-lightbox-overlay {
        position: fixed;
        inset: 0;
        background-color: rgba(15, 23, 42, 0.85);
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
        z-index: 20000;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 24px;
        box-sizing: border-box;
      }

      .promo-lightbox-overlay.active {
        display: flex;
      }

      .promo-lightbox-content {
        position: relative;
        max-width: 92vw;
        max-height: 90vh;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .promo-lightbox-close {
        position: fixed;
        top: 20px;
        right: 24px;
        width: 42px;
        height: 42px;
        border-radius: 50%;
        background: rgba(30, 41, 59, 0.85);
        border: 1px solid rgba(255, 255, 255, 0.25);
        color: #ffffff;

        line-height: 1;
        display: flex;

      }

      .promo-lightbox-img {
        max-width: 92vw;
        max-height: 84vh;

      @media screen and (max-width: 768px) {

    <div id="promo-page-wrapper">
      <!-- 우상단 Float Sticky 보기 방식 토글 버튼 (아이콘 보기 <-> 카드 보기) -->
      <div class="promo-floating-view-toggle">
        <button type="button" class="promo-view-toggle-btn" id="promo-view-toggle-btn" title="카드 보기로 전환" aria-label="보기 방식 전환">
          <span class="material-symbols-outlined" id="promo-view-toggle-icon">view_agenda</span>
          <span id="promo-view-toggle-label">카드 보기</span>
        </button>
      </div>

      <!-- promo.json 동적 렌더링 영역 -->
      <div id="promo-sections-root"></div>

      <!-- 1. 카드 상세 정보 팝업 (Detail Modal) -->
      <div class="promo-detail-overlay" id="promo-detail-modal" role="dialog" aria-modal="true" aria-label="상세 정보">
        <div class="promo-detail-dialog">
          <div class="promo-detail-header">
            <div class="promo-detail-title-group" id="promo-detail-title-group"></div>
            <button type="button" class="promo-detail-close" id="promo-detail-close" title="닫기 (ESC)">&times;</button>
          </div>
          <div class="promo-detail-body" id="promo-detail-body"></div>
        </div>
      </div>

      <!-- 2. 대표이미지 크게보기 모달 (Lightbox) -->
      <div class="promo-lightbox-overlay" id="promo-lightbox" role="dialog" aria-modal="true" aria-label="이미지 크게 보기">
        <button type="button" class="promo-lightbox-close" id="promo-lightbox-close" title="닫기 (ESC)">&times;</button>
        <div class="promo-lightbox-content">
          <img class="promo-lightbox-img" id="promo-lightbox-img" src="" alt="">
          <div class="promo-lightbox-caption" id="promo-lightbox-caption"></div>
        </div>
      </div>
    </div>

    <script>
      (function () {
        const rootEl = document.getElementById('promo-sections-root');
        const detailModal = document.getElementById('promo-detail-modal');
        const detailTitleGroup = document.getElementById('promo-detail-title-group');
        const detailBody = document.getElementById('promo-detail-body');
        const detailCloseBtn = document.getElementById('promo-detail-close');

        const lightbox = document.getElementById('promo-lightbox');
        const lightboxImg = document.getElementById('promo-lightbox-img');
        const lightboxCaption = document.getElementById('promo-lightbox-caption');
        const lightboxCloseBtn = document.getElementById('promo-lightbox-close');

        const viewToggleBtn = document.getElementById('promo-view-toggle-btn');
        const viewToggleIcon = document.getElementById('promo-view-toggle-icon');
        const viewToggleLabel = document.getElementById('promo-view-toggle-label');
        let currentViewMode = 'icon'; // 기본값: 아이콘 보기
        let cachedPromoData = null;

        if (!rootEl) return;

        function normalizeAssetPath(p) {
          if (!p) return '';
          if (p.startsWith('http://') || p.startsWith('https://') || p.startsWith('data:') || p.startsWith('/')) {
            return p;
          }
          return '/' + p;
        }

        function isGithubUrl(url) {
          return typeof url === 'string' && /github\.com/i.test(url);
        }

        function getGithubSvgHtml(size) {
          const s = size || 18;
          return '<svg class="promo-github-icon" width="' + s + '" height="' + s + '" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"></path></svg>';
        }

        function attachIconFallback(imgEl, item) {
          if (!imgEl) return;
          const candidates = [];
          if (item && item.projectId) {
            const folder = '/source/' + item.projectId + '/';
            ['icon.svg', 'icon.png', 'favicon.svg', 'favicon.png', 'favicon.ico', 'logo.svg', 'logo.png'].forEach(function (file) {
              candidates.push(folder + file);
            });
          }
          let tryIdx = 0;
          imgEl.addEventListener('error', function () {
            while (tryIdx < candidates.length) {
              const nextSrc = candidates[tryIdx++];
              if (nextSrc !== imgEl.getAttribute('src')) {
                imgEl.setAttribute('src', nextSrc);
                return;
              }
            }
            imgEl.style.display = 'none';
          });
        }

        function normalizeLinks(item) {
          if (Array.isArray(item.links)) {
            return item.links.map(function (l) {
              if (typeof l === 'string') return { label: '', url: l };
              return { label: l.label || '', url: l.url || '' };
            }).filter(function (l) { return !!l.url; });
          }
          if (typeof item.url === 'string' && item.url) {
            return [{ label: '', url: item.url }];
          }
          return [];
        }

        function formatDescriptionHtml(item, includeProjectId) {
          const lines = [];
          if (includeProjectId && item.projectId) {
            lines.push('Project ID: ' + escapeHtml(item.projectId));
          }
          const rawDesc = item.description !== undefined ? item.description : item.설명;
          if (Array.isArray(rawDesc)) {
            rawDesc.forEach(function (line) {
              lines.push(escapeHtml(String(line)));
            });
          } else if (rawDesc) {
            String(rawDesc).split('\n').forEach(function (line) {
              lines.push(escapeHtml(line));
            });
          }
          return lines.join('<br>');
        }

        function escapeHtml(str) {
          return String(str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
        }

        function shouldShowUrlBox(item, links) {
          if (typeof item.showUrl === 'boolean') return item.showUrl;
          if (!links.length) return false;
          const firstUrl = links[0].url;
          return !firstUrl.includes('github.io') && !firstUrl.includes('github.com');
        }

        function openLightbox(src, alt) {
          if (!lightbox || !lightboxImg) return;
          lightboxImg.src = src;
          lightboxImg.alt = alt || '';
          if (lightboxCaption) {
            lightboxCaption.textContent = alt || '';
          }
          lightbox.classList.add('active');
        }

        function closeLightbox() {
          if (!lightbox || !lightboxImg) return;
          lightbox.classList.remove('active');
          lightboxImg.src = '';
        }

        function openDetailModal(item) {
          if (!detailModal || !detailTitleGroup || !detailBody) return;

          const links = normalizeLinks(item);
          const iconSrc = normalizeAssetPath(item.icon || item.아이콘);
          const imgSrc = normalizeAssetPath(item.image || item.대표이미지);
          const videoSrc = normalizeAssetPath(item.video || item.동영상);
          const techStack = item.techStack || item.기술 || [];
          const considerations = item.considerations || item.고민중인내용 || [];
          const changelog = item.changelog || item.변경이력 || [];

          // 1. 헤더 구성
          detailTitleGroup.innerHTML = '';
          if (iconSrc) {
            const modalIcon = document.createElement('img');
            modalIcon.className = 'promo-detail-icon';
            modalIcon.src = iconSrc;
            modalIcon.alt = (item.title || '') + ' 아이콘';
            attachIconFallback(modalIcon, item);
            detailTitleGroup.appendChild(modalIcon);
          }

          const modalTitle = document.createElement('h2');
          modalTitle.className = 'promo-detail-title';
          modalTitle.style.cssText = 'border:none; padding:0; margin:0; width:auto;';
          modalTitle.textContent = item.title || '';
          detailTitleGroup.appendChild(modalTitle);

          if (item.projectId) {
            const badgeSpan = document.createElement('span');
            badgeSpan.className = 'promo-detail-project-badge';
            badgeSpan.textContent = item.projectId;
            detailTitleGroup.appendChild(badgeSpan);
          }

          // 2. 본문 구성
          let bodyHtml = '';

          // 2-1. 바로가기 아이콘 버튼들 (웹앱: material-symbols-outlined, GitHub: GitHub 아이콘만 표시)
          if (links.length > 0) {
            bodyHtml += '<div class="promo-detail-links-bar">';
            links.forEach(function (link) {
              const gh = isGithubUrl(link.url);
              const tooltip = gh
                ? (link.label && link.label.toLowerCase() !== 'github' ? 'GitHub (' + link.label + ')' : 'GitHub 저장소 열기')
                : ((item.title || link.label || '웹앱') + ' 열기');
              bodyHtml += `
                <a class="promo-detail-link-btn ${gh ? 'github-btn' : ''}" href="${escapeHtml(link.url)}" target="_blank" rel="noopener noreferrer" title="${escapeHtml(tooltip)}">
                  ${gh ? getGithubSvgHtml(20) : '<span class="material-symbols-outlined">open_in_new</span>'}
                </a>
              `;
            });
            bodyHtml += '</div>';
          }

          // 2-2. 상세 설명 및 대표 이미지/영상
          const overviewText = item.overview || item.상세설명;
          const descHtml = overviewText
            ? (Array.isArray(overviewText) ? overviewText.map(escapeHtml).join('<br>') : escapeHtml(overviewText).replace(/\n/g, '<br>'))
            : formatDescriptionHtml(item, false);

          if (descHtml || imgSrc || videoSrc) {
            bodyHtml += `
              <div class="promo-detail-section">
                <div class="promo-detail-section-title">📌 소개</div>
                ${descHtml ? `<div class="promo-detail-desc-box">${descHtml}</div>` : ''}
                ${imgSrc ? `<img class="promo-preview-img promo-modal-preview-img" src="${escapeHtml(imgSrc)}" alt="${escapeHtml(item.title)}" title="클릭하여 크게 보기" onerror="this.style.display='none'">` : ''}
                ${videoSrc ? `<video src="${escapeHtml(videoSrc)}" controls autoplay muted loop style="width:100%; border-radius:8px; margin-top:8px; border:1px solid #e2e8f0;"></video>` : ''}
              </div>
            `;
          }

          // 2-3. 구성한 기술
          const techList = Array.isArray(techStack) ? techStack : (techStack ? [techStack] : []);
          if (techList.length > 0) {
            bodyHtml += `
              <div class="promo-detail-section">
                <div class="promo-detail-section-title">🛠️ 구성한 기술</div>
                <div class="promo-tech-chips">
                  ${techList.map(function (t) { return `<span class="promo-tech-chip">${escapeHtml(t)}</span>`; }).join('')}
                </div>
              </div>
            `;
          }

          // 2-4. 고민중인 내용
          const consList = Array.isArray(considerations) ? considerations : (considerations ? [considerations] : []);
          if (consList.length > 0) {
            bodyHtml += `
              <div class="promo-detail-section">
                <div class="promo-detail-section-title">🤔 고민중인 내용</div>
                <ul class="promo-detail-list">
                  ${consList.map(function (c) { return `<li>${escapeHtml(c)}</li>`; }).join('')}
                </ul>
              </div>
            `;
          }

          // 2-5. 변경 이력
          const logList = Array.isArray(changelog) ? changelog : (changelog ? [changelog] : []);
          if (logList.length > 0) {
            bodyHtml += `
              <div class="promo-detail-section">
                <div class="promo-detail-section-title">📜 변경 이력</div>
                <div class="promo-changelog-list">
                  ${logList.map(function (entry) {
                    if (typeof entry === 'string') {
                      return `<div class="promo-changelog-item"><span class="promo-changelog-content">${escapeHtml(entry)}</span></div>`;
                    }
                    const dateOrVer = [entry.date || entry.날짜, entry.version || entry.버전].filter(Boolean).join(' ');
                    const content = entry.content || entry.내용 || '';
                    return `
                      <div class="promo-changelog-item">
                        ${dateOrVer ? `<span class="promo-changelog-date">${escapeHtml(dateOrVer)}</span>` : ''}
                        <span class="promo-changelog-content">${escapeHtml(content)}</span>
                      </div>
                    `;
                  }).join('')}
                </div>
              </div>
            `;
          }

          detailBody.innerHTML = bodyHtml;

          // 팝업 내부의 대표 이미지 클릭 시에도 크게보기(Lightbox) 연동
          detailBody.querySelectorAll('.promo-modal-preview-img').forEach(function (img) {
            img.addEventListener('click', function (e) {
              e.stopPropagation();
              openLightbox(img.getAttribute('src'), img.getAttribute('alt'));
            });
          });

          detailModal.classList.add('active');
        }

        function closeDetailModal() {
          if (!detailModal) return;
          detailModal.classList.remove('active');
        }

        function renderPromoSections(data) {
          cachedPromoData = data;
          const sections = (data && Array.isArray(data.sections)) ? data.sections : [];
          rootEl.innerHTML = '';

          const isIconMode = currentViewMode === 'icon';

          sections.forEach(function (section) {
            const sectionEl = document.createElement('section');
            sectionEl.className = 'promo-section';

            // Sticky & 펼치기/접기 섹션 헤더
            const headerBar = document.createElement('div');
            headerBar.className = 'promo-section-header';
            headerBar.setAttribute('role', 'button');
            headerBar.setAttribute('tabindex', '0');
            headerBar.setAttribute('aria-expanded', 'true');
            headerBar.title = '클릭하여 접기/펼치기';

            const h1 = document.createElement('h1');
            h1.className = 'promo-section-heading';
            h1.textContent = section.title || '';
            headerBar.appendChild(h1);

            const chevron = document.createElement('span');
            chevron.className = 'material-symbols-outlined promo-section-chevron';
            chevron.setAttribute('aria-hidden', 'true');
            chevron.textContent = 'expand_more';
            headerBar.appendChild(chevron);

            const toggleSection = function () {
              const isCollapsed = sectionEl.classList.toggle('collapsed');
              headerBar.setAttribute('aria-expanded', isCollapsed ? 'false' : 'true');
            };

            headerBar.addEventListener('click', toggleSection);
            headerBar.addEventListener('keydown', function (e) {
              if (e.key === 'Enter' || e.key === ' ') {
                e.preventDefault();
                toggleSection();
              }
            });

            sectionEl.appendChild(headerBar);

            // 애니메이션 래퍼
            const bodyWrap = document.createElement('div');
            bodyWrap.className = 'promo-section-body';

            const bodyInner = document.createElement('div');
            bodyInner.className = 'promo-section-inner';

            const grid = document.createElement('div');
            grid.className = isIconMode ? 'promo-icon-grid' : 'promo-grid';

            const items = Array.isArray(section.items) ? section.items : [];
            items.forEach(function (item) {
              const links = normalizeLinks(item);
              const iconSrc = normalizeAssetPath(item.icon || item.아이콘);
              const imgSrc = normalizeAssetPath(item.image || item.대표이미지);
              const isToolSection = section.id === 'tools' || section.id === 'desktop';

              if (isIconMode) {
                // 아이콘 보기: 아이콘 + 제목만 표시, 클릭 시 상세 정보 팝업
                const iconTile = document.createElement('div');
                iconTile.className = 'promo-icon-item';
                iconTile.title = (item.title || '') + ' 상세 정보 보기';

                const iconBox = document.createElement('div');
                iconBox.className = 'promo-icon-box';

                const fallbackIconName = section.id === 'android' ? 'android'
                  : (section.id === 'desktop' ? 'desktop_windows'
                  : (section.id === 'video' ? 'smart_display' : 'language'));

                if (iconSrc) {
                  const iconImg = document.createElement('img');
                  iconImg.src = iconSrc;
                  iconImg.alt = (item.title || '') + ' 아이콘';
                  attachIconFallback(iconImg, item);
                  iconImg.addEventListener('error', function () {
                    if (iconImg.style.display === 'none' && !iconBox.querySelector('.promo-icon-fallback')) {
                      const fbSpan = document.createElement('span');
                      fbSpan.className = 'material-symbols-outlined promo-icon-fallback';
                      fbSpan.textContent = fallbackIconName;
                      iconBox.appendChild(fbSpan);
                    }
                  });
                  iconBox.appendChild(iconImg);
                } else {
                  const fbSpan = document.createElement('span');
                  fbSpan.className = 'material-symbols-outlined promo-icon-fallback';
                  fbSpan.textContent = fallbackIconName;
                  iconBox.appendChild(fbSpan);
                }

                const labelDiv = document.createElement('div');
                labelDiv.className = 'promo-icon-label';
                labelDiv.textContent = item.title || '';

                iconTile.appendChild(iconBox);
                iconTile.appendChild(labelDiv);

                iconTile.addEventListener('click', function () {
                  openDetailModal(item);
                });

                grid.appendChild(iconTile);
                return;
              }

              // 카드 보기
              const card = document.createElement('div');
              card.className = 'promo-card';

              // 1. 카드 상단 헤더 (아이콘 - 제목 - 아이콘 링크들)
              const header = document.createElement('div');
              header.className = 'promo-card-header';

              const titleWrap = document.createElement('div');
              titleWrap.className = 'promo-card-title-wrap';

              if (iconSrc) {
                const iconImg = document.createElement('img');
                iconImg.className = 'promo-tool-icon';
                iconImg.src = iconSrc;
                iconImg.alt = (item.title || '') + ' 아이콘';
                attachIconFallback(iconImg, item);
                titleWrap.appendChild(iconImg);
              }

              const titleDiv = document.createElement('div');
              titleDiv.className = 'promo-card-title';
              titleDiv.textContent = item.title || '';
              titleWrap.appendChild(titleDiv);

              header.appendChild(titleWrap);

              if (links.length > 0) {
                const actionsDiv = document.createElement('div');
                actionsDiv.className = 'promo-card-actions';

                links.forEach(function (link) {
                  const gh = isGithubUrl(link.url);
                  const a = document.createElement('a');
                  a.className = gh ? 'promo-card-badge promo-card-badge-github' : 'promo-card-badge';
                  a.href = link.url;
                  a.target = '_blank';
                  a.rel = 'noopener noreferrer';
                  a.title = gh
                    ? (link.label && link.label.toLowerCase() !== 'github' ? 'GitHub (' + link.label + ')' : 'GitHub 저장소 열기')
                    : ((item.title || link.label || '웹앱') + ' 열기');

                  if (gh) {
                    a.innerHTML = getGithubSvgHtml(18);
                  } else {
                    const iconSpan = document.createElement('span');
                    iconSpan.className = 'material-symbols-outlined';
                    iconSpan.textContent = 'open_in_new';
                    a.appendChild(iconSpan);
                  }

                  a.addEventListener('click', function (e) {
                    e.stopPropagation();
                  });

                  actionsDiv.appendChild(a);
                });

                header.appendChild(actionsDiv);
              }

              card.appendChild(header);

              // 2. 외부 도메인 URL 노출 여부 (github.io / github.com 은 기본 숨김)
              if (shouldShowUrlBox(item, links) && links.length > 0) {
                const urlBox = document.createElement('div');
                urlBox.className = 'promo-card-url-box';
                const urlAnchor = document.createElement('a');
                urlAnchor.className = 'promo-card-url';
                urlAnchor.href = links[0].url;
                urlAnchor.target = '_blank';
                urlAnchor.rel = 'noopener noreferrer';
                urlAnchor.textContent = links[0].url;
                urlAnchor.addEventListener('click', function (e) {
                  e.stopPropagation();
                });
                urlBox.appendChild(urlAnchor);
                card.appendChild(urlBox);
              }

              // 3. 설명 (툴 섹션인 경우 Project ID 자동 표시)
              const descHtml = formatDescriptionHtml(item, isToolSection);
              if (descHtml) {
                const descP = document.createElement('p');
                descP.className = 'promo-card-desc';
                descP.innerHTML = descHtml;
                card.appendChild(descP);
              }

              // 4. 대표 이미지 (툴 섹션 카드에 표시, 클릭 시 크게보기 Lightbox)
              if (imgSrc && isToolSection) {
                const previewImg = document.createElement('img');
                previewImg.className = 'promo-preview-img';
                previewImg.src = imgSrc;
                previewImg.alt = item.title || '';
                previewImg.title = '클릭하여 크게 보기';
                previewImg.addEventListener('error', function () {
                  previewImg.style.display = 'none';
                });
                previewImg.addEventListener('click', function (e) {
                  e.stopPropagation();
                  openLightbox(imgSrc, item.title || '');
                });
                card.appendChild(previewImg);
              }

              // 5. 하단 상세보기 힌트
              const footerHint = document.createElement('div');
              footerHint.className = 'promo-card-footer-hint';
              footerHint.innerHTML = '<span>상세 정보 보기</span><span class="material-symbols-outlined" style="font-size:15px;">info</span>';
              card.appendChild(footerHint);

              // 카드 클릭 시 상세 정보 팝업 열기
              card.addEventListener('click', function () {
                openDetailModal(item);
              });

              grid.appendChild(card);
            });

            bodyInner.appendChild(grid);
            bodyWrap.appendChild(bodyInner);
            sectionEl.appendChild(bodyWrap);
            rootEl.appendChild(sectionEl);
          });

          // 동적 생성된 h1 태그를 사이드바 목차(TOC)에 반영
          if (window.SiteModules && window.SiteModules.TOC) {
            if (typeof window.SiteModules.TOC.init === 'function') {
              window.SiteModules.TOC.init();
            }
            const tocTree = document.getElementById('toc-tree');
            if (tocTree && typeof window.SiteModules.TOC.addContentsList === 'function') {
              tocTree.innerHTML = '';
              window.SiteModules.TOC.addContentsList(tocTree);
            }
          }
        }

        function updateViewToggleButtonUI() {
          if (!viewToggleBtn) return;
          if (currentViewMode === 'icon') {
            if (viewToggleIcon) viewToggleIcon.textContent = 'view_agenda';
            if (viewToggleLabel) viewToggleLabel.textContent = '카드 보기';
            viewToggleBtn.title = '카드 보기로 전환';
          } else {
            if (viewToggleIcon) viewToggleIcon.textContent = 'apps';
            if (viewToggleLabel) viewToggleLabel.textContent = '아이콘 보기';
            viewToggleBtn.title = '아이콘 보기로 전환';
          }
        }

        if (viewToggleBtn) {
          viewToggleBtn.addEventListener('click', function (e) {
            e.stopPropagation();
            currentViewMode = currentViewMode === 'icon' ? 'card' : 'icon';
            updateViewToggleButtonUI();
            if (cachedPromoData) {
              renderPromoSections(cachedPromoData);
            }
          });
        }

        // 모달 닫기 이벤트 바인딩
        if (detailCloseBtn) {
          detailCloseBtn.addEventListener('click', function (e) {
            e.stopPropagation();
            closeDetailModal();
          });
        }

        if (detailModal) {
          detailModal.addEventListener('click', function (e) {
            if (e.target === detailModal) {
              closeDetailModal();
            }
          });
        }

        if (lightboxCloseBtn) {
          lightboxCloseBtn.addEventListener('click', function (e) {
            e.stopPropagation();
            closeLightbox();
          });
        }

        if (lightbox) {
          lightbox.addEventListener('click', function (e) {
            if (e.target === lightbox || e.target.classList.contains('promo-lightbox-content')) {
              closeLightbox();
            }
          });
        }

        const onKeyDown = function (e) {
          if (e.key === 'Escape') {
            if (lightbox && lightbox.classList.contains('active')) {
              closeLightbox();
            } else if (detailModal && detailModal.classList.contains('active')) {
              closeDetailModal();
            }
          }
        };
        window.addEventListener('keydown', onKeyDown);
        window.activeWindowListeners = window.activeWindowListeners || [];
        window.activeWindowListeners.push({ type: 'keydown', fn: onKeyDown });

        // promo.json 로드 및 렌더링
        fetch('/promo.json', { cache: 'no-cache' })
          .then(function (res) {
            if (!res.ok) throw new Error('Failed to load /promo.json (status ' + res.status + ')');
            return res.json();
          })
          .then(function (data) {
            renderPromoSections(data);
          })
          .catch(function (err) {
            console.error('[Promo] JSON 로드 오류:', err);
            rootEl.innerHTML = '<p style="color:#dc2626;">홍보 데이터를 불러오지 못했습니다: ' + escapeHtml(err.message) + '</p>';
          });
      })();
    </script>
  </article>
</body>

</html>
