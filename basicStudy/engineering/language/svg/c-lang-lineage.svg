<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="340" viewBox="0 0 760 340" font-family="'Pretendard', 'Malgun Gothic', 'Apple SD Gothic Neo', 'Nanum Gothic', sans-serif">
  <title>주요 프로그래밍 언어 패러다임 및 실행 계보 연계도</title>
  <desc>기계어·어셈블리에서 출발한 절차적 네이티브 언어 C를 뿌리로, C++·Rust(네이티브 시스템), Java·C#(가상머신 바이트코드), Python·JS(인터프리터 스크립트)로 분화하는 계보도입니다.</desc>
  <defs>
    <marker id="lg-arr-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#2563eb"/>
    </marker>
    <marker id="lg-arr-orange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#ea580c"/>
    </marker>
    <marker id="lg-arr-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#7c3aed"/>
    </marker>
    <marker id="lg-arr-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#059669"/>
    </marker>
    <clipPath id="lg-clip-c"><rect x="176" y="88" width="184" height="164" rx="12"/></clipPath>
    <clipPath id="lg-clip-sys"><rect x="412" y="14" width="334" height="94" rx="10"/></clipPath>
    <clipPath id="lg-clip-vm"><rect x="412" y="123" width="334" height="94" rx="10"/></clipPath>
    <clipPath id="lg-clip-int"><rect x="412" y="232" width="334" height="94" rx="10"/></clipPath>
  </defs>

  <rect width="760" height="340" rx="12" fill="#fcfcfa" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- 연결 화살표 -->
  <line x1="142" y1="170" x2="172" y2="170" stroke="#2563eb" stroke-width="2.2" marker-end="url(#lg-arr-blue)"/>
  <path d="M360,145 L386,145 L386,61 L408,61" fill="none" stroke="#ea580c" stroke-width="2" marker-end="url(#lg-arr-orange)"/>
  <line x1="360" y1="170" x2="408" y2="170" stroke="#7c3aed" stroke-width="2" marker-end="url(#lg-arr-purple)"/>
  <path d="M360,195 L386,195 L386,279 L408,279" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#lg-arr-green)"/>

  <!-- 1. 기계어 · 어셈블리 -->
  <rect data-key="asm" x="14" y="104" width="128" height="132" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.8"/>
  <rect x="24" y="114" width="108" height="22" rx="5" fill="#e2e8f0"/>
  <text x="78" y="129" text-anchor="middle" font-size="11.5" font-weight="800" fill="#1e293b">기계어 · 어셈블리</text>
  <text x="78" y="152" text-anchor="middle" font-size="10.5" fill="#475569">하드웨어 1:1 종속</text>
  <rect x="24" y="164" width="108" height="58" rx="6" fill="#0f172a"/>
  <g font-family="'D2Coding', 'Consolas', monospace" font-size="10.2">
    <text x="32" y="181" fill="#67e8f9">01010101 01001000</text>
    <text x="32" y="197" fill="#fde68a">pushq %rbp</text>
    <text x="32" y="213" fill="#fde68a">movl  $0, %eax</text>
  </g>

  <!-- 2. C 언어 (핵심 뿌리) -->
  <g clip-path="url(#lg-clip-c)">
    <rect x="176" y="88" width="184" height="164" rx="12" fill="#eff6ff"/>
    <rect x="176" y="88" width="184" height="38" fill="#2563eb"/>
  </g>
  <rect data-key="langc" x="176" y="88" width="184" height="164" rx="12" fill="none" stroke="#2563eb" stroke-width="2.2"/>
  <text x="268" y="112" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">C 언어 (1972~)</text>
  <text x="268" y="145" text-anchor="middle" font-size="11.5" font-weight="800" fill="#1e3a8a">절차적 · 네이티브 직결</text>
  <text x="268" y="164" text-anchor="middle" font-size="10.8" fill="#334155">OS · 임베디드 · 컴파일러의 모체</text>
  <rect x="188" y="175" width="160" height="24" rx="12" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="268" y="191" text-anchor="middle" font-family="'D2Coding', 'Consolas', monospace" font-size="10.5" font-weight="700" fill="#1d4ed8">gcc / cl.exe ➔ .exe 직접 실행</text>
  <rect x="186" y="207" width="164" height="33" rx="6" fill="#ffffff" stroke="#bfdbfe"/>
  <text x="268" y="222" text-anchor="middle" font-size="10.3" font-weight="700" fill="#1e40af">안내판 비유: 국가별 언어 병기</text>
  <text x="268" y="235" text-anchor="middle" font-size="9.5" fill="#475569">화장실 │ toilet │ 化粧室 (직독)</text>

  <!-- 3-A. 네이티브 확장 (C++ / Rust) -->
  <g clip-path="url(#lg-clip-sys)">
    <rect x="412" y="14" width="334" height="94" rx="10" fill="#ffffff"/>
    <rect x="412" y="14" width="334" height="32" fill="#ffedd5"/>
  </g>
  <rect data-key="sys" x="412" y="14" width="334" height="94" rx="10" fill="none" stroke="#f97316" stroke-width="1.8"/>
  <text x="426" y="35" font-size="13" font-weight="800" fill="#9a3412">C++ · Rust</text>
  <rect x="614" y="20" width="120" height="20" rx="10" fill="#ffffff" stroke="#fdba74"/>
  <text x="674" y="34" text-anchor="middle" font-size="10.2" font-weight="700" fill="#c2410c">네이티브 시스템 확장</text>
  <text x="426" y="66" font-size="10.8" fill="#334155">· 직접 실행 속도에 <tspan font-weight="700" fill="#9a3412">객체지향(C++) · 메모리 안전(Rust)</tspan> 결합</text>
  <text x="426" y="86" font-size="10.6" fill="#64748b">· 활용: 고성능 게임 엔진, 브라우저 코어, 자율주행, OS 커널</text>

  <!-- 3-B. 가상머신 (Java / C# / Kotlin) -->
  <g clip-path="url(#lg-clip-vm)">
    <rect x="412" y="123" width="334" height="94" rx="10" fill="#ffffff"/>
    <rect x="412" y="123" width="334" height="32" fill="#ede9fe"/>
  </g>
  <rect data-key="vm" x="412" y="123" width="334" height="94" rx="10" fill="none" stroke="#7c3aed" stroke-width="1.8"/>
  <text x="426" y="144" font-size="13" font-weight="800" fill="#4c1d95">Java · C# · Kotlin</text>
  <rect x="594" y="129" width="140" height="20" rx="10" fill="#ffffff" stroke="#c4b5fd"/>
  <text x="664" y="143" text-anchor="middle" font-size="10.2" font-weight="700" fill="#5b21b6">가상머신(VM) · 객체지향</text>
  <text x="426" y="175" font-size="10.8" fill="#334155">· <tspan font-family="'D2Coding', monospace" font-weight="700" fill="#5b21b6">javac</tspan> 바이트코드 번역 후 <tspan font-family="'D2Coding', monospace" font-weight="700" fill="#5b21b6">java.exe(JVM)</tspan> 구동 (이식성)</text>
  <text x="426" y="195" font-size="10.6" fill="#64748b">· 안내판 비유: <tspan font-weight="700" fill="#4c1d95">공용어(영어 toilet) 통일</tspan> — 대규모 서버·기업 환경</text>

  <!-- 3-C. 인터프리터 (Python / JS) -->
  <g clip-path="url(#lg-clip-int)">
    <rect x="412" y="232" width="334" height="94" rx="10" fill="#ffffff"/>
    <rect x="412" y="232" width="334" height="32" fill="#d1fae5"/>
  </g>
  <rect data-key="interp" x="412" y="232" width="334" height="94" rx="10" fill="none" stroke="#10b981" stroke-width="1.8"/>
  <text x="426" y="253" font-size="13" font-weight="800" fill="#065f46">Python · JavaScript</text>
  <rect x="594" y="238" width="140" height="20" rx="10" fill="#ffffff" stroke="#6ee7b7"/>
  <text x="664" y="252" text-anchor="middle" font-size="10.2" font-weight="700" fill="#047857">인터프리터 · 동적 스크립트</text>
  <text x="426" y="284" font-size="10.8" fill="#334155">· 별도 빌드 없이 실행기(<tspan font-family="'D2Coding', monospace" font-weight="700" fill="#047857">py.exe · V8</tspan>)가 코드를 즉시 해석</text>
  <text x="426" y="304" font-size="10.6" fill="#64748b">· 안내판 비유: <tspan font-weight="700" fill="#065f46">QR 번역 앱 배포</tspan> — AI·데이터 과학·웹 생산성</text>
</svg>
