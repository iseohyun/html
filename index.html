  <style type="text/css">
    #site-history {
      width: 96%;
      margin: 24px auto 200px;
      padding: 0;
      list-style: none;
      border: none;
      font-size: 75%;
      line-height: 1.35;
    }

    /* ==========================================
       달력 필터 · 화면별 설정 (헤더 아래 패널에 들어가는 내용)
       ========================================== */
    .cal-filter-content {
      font-size: 12px;
      font-family: var(--font-main);
    }

    .cal-settings-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      width: 100%;
    }

    .cal-settings-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
    }

    .cal-settings-label {
      font-weight: 700;
      color: #334155;
      white-space: nowrap;
      min-width: 54px;
    }

    .cal-bg-slider {
      flex: 1;
      min-width: 120px;
      cursor: pointer;
      accent-color: #228be6;
      margin: 0;
    }

    .cal-bg-percent-label {
      font-family: var(--font-monospace);
      font-weight: 800;
      font-size: 0.98em;
      color: #1e293b;
      min-width: 38px;
      text-align: right;
    }

    table.cal-filter-table {
      margin: 0;
      border: 1px solid #e2e8f0;
      border-collapse: collapse;
      width: 100%;
      font-family: var(--font-main);
      font-stretch: 100%;
      counter-increment: none;
      background: #ffffff;
    }

    table.cal-filter-table th {
      background-color: #f8fafc;
      color: #334155;
      font-weight: 800;
      font-size: 1em;
      padding: 6px 12px;
      border: 1px solid #e2e8f0;
      white-space: nowrap;
      text-align: center;
      width: 64px;
    }

    table.cal-filter-table td {
      padding: 6px 10px;
      border: 1px solid #e2e8f0;
      text-align: left;
      background-color: #ffffff;
    }

    .cal-filter-options {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
    }

    .cal-filter-chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 8px;
      border-radius: 6px;
      border: 1px solid #dee2e6;
      background-color: #f8fafc;
      color: #334155;
      font-size: 0.98em;
      font-weight: 600;
      cursor: pointer;
      user-select: none;
      line-height: 1.3;
      transition: opacity 0.15s ease, box-shadow 0.15s ease;
    }

    .cal-filter-chip:hover {
      box-shadow: 0 1px 4px rgba(15, 23, 42, 0.1);
    }

    .cal-filter-chip input[type="checkbox"] {
      margin: 0;
      cursor: pointer;
      accent-color: #228be6;
    }

    .cal-search-input {
      padding: 4px 8px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 1em;
      font-family: inherit;
      width: 140px;
      outline: none;
    }

    .cal-search-input:focus {
      border-color: #228be6;
      box-shadow: 0 0 0 2px rgba(34, 139, 230, 0.15);
    }

    /* ==========================================
       환경(배경색) & 분류(우상단 이모지 배지) 컬러 팔레트
       - Web(주황색), Android(초록색), Desktop(파란색), Video(빨간색), iseohyun(흰색)
       - --cal-env-bg-alpha 변수(기본 0.25 = 25%)로 배경 농도(%) 실시간 제어
       ========================================== */
    :root {
      --cal-env-bg-alpha: 0.25;
      --cal-title-font-size: 12px;
      --cal-title-zoom: 0.7500;
      --cal-content-font-size: 12px;
      --cal-content-zoom: 0.6667;
    }

    .env-iseohyun {
      background-color: #ffffff !important;
      border-color: #cbd5e1 !important;
    }

    .env-webapp {
      background-color: rgba(255, 146, 43, var(--cal-env-bg-alpha, 0.25)) !important;
      border-color: rgba(247, 103, 7, calc(min(1, var(--cal-env-bg-alpha, 0.25) + 0.28))) !important;
    }

    .env-android {
      background-color: rgba(64, 192, 87, var(--cal-env-bg-alpha, 0.25)) !important;
      border-color: rgba(43, 138, 62, calc(min(1, var(--cal-env-bg-alpha, 0.25) + 0.28))) !important;
    }

    .env-desktop {
      background-color: rgba(51, 154, 240, var(--cal-env-bg-alpha, 0.25)) !important;
      border-color: rgba(25, 113, 194, calc(min(1, var(--cal-env-bg-alpha, 0.25) + 0.28))) !important;
    }

    .env-video {
      background-color: rgba(255, 107, 107, var(--cal-env-bg-alpha, 0.25)) !important;
      border-color: rgba(224, 49, 49, calc(min(1, var(--cal-env-bg-alpha, 0.25) + 0.28))) !important;
    }

    /* 분류 (모달 제목/필터 텍스트색) */
    .type-add {
      color: #16a34a !important;
      font-weight: 800;
    }

    .type-changed {
      color: #2563eb !important;
      font-weight: 800;
    }

    .type-fixed {
      color: #d97706 !important;
      font-weight: 800;
    }

    .type-deleted {
      color: #dc2626 !important;
      font-weight: 800;
    }

    /* 달력 카드 우상단 border에 걸치는 분류 이모지 배지 (원형 배경 없음: ✨, 🐛, ♻️, 🔥) */
    .cal-type-badge {
      position: absolute;
      top: -7px;
      right: -6px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: transparent !important;
      border: none !important;
      box-shadow: none !important;
      font-size: 12px;
      line-height: 1;
      filter: drop-shadow(0 1px 1.5px rgba(15, 23, 42, 0.22));
      z-index: 3;
      user-select: none;
      pointer-events: none;
    }

    .cal-filter-type-emoji {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      line-height: 1;
    }

    /* ==========================================
       최근 업데이트 주간 역순 달력 스타일 (평소 폰트의 75% 기준)
       ========================================== */
    .update-calendar-wrapper {
      width: 100%;
      overflow-x: auto;
      border-radius: 14px;
      border: 1px solid #cbd5e1;
      background: #ffffff;
      box-shadow: 0 2px 10px rgba(15, 23, 42, 0.04);
    }

    table.update-calendar-table {
      width: 100%;
      table-layout: fixed;
      border-collapse: collapse;
      margin: 0;
      border: none;
      font-family: var(--font-main);
      font-size: 1em;
      font-stretch: 100%;
      counter-increment: none;
    }

    table.update-calendar-table thead {
      /* 달력은 자체 테두리 상자(.update-calendar-wrapper) 안에 있어 상자 기준으로 붙는다 */
      position: sticky;
      top: 0;
      z-index: 5;
      background-color: #f8fafc;
      color: #334155;
      border-bottom: 2px solid #cbd5e1;
    }

    table.update-calendar-table th {
      width: 14.2857%;
      padding: 8px 4px;
      font-size: 1.05em;
      font-weight: 800;
      text-align: center;
      border: 1px solid #e2e8f0;
      border-top: none;
      background-color: #f8fafc;
      color: #334155;
    }

    table.update-calendar-table th.sun-col {
      color: #e03131;
    }

    table.update-calendar-table th.sat-col {
      color: #1971c2;
    }

    table.update-calendar-table td.cal-cell {
      vertical-align: top;
      text-align: left;
      padding: 5px 6px 8px;
      min-height: 64px;
      height: 64px;
      max-width: 0;
      border: 1px solid #e2e8f0;
      background-color: #ffffff;
      box-sizing: border-box;
      transition: background-color 0.15s ease;
    }

    table.update-calendar-table td.cal-cell.out-of-year {
      background-color: #f8fafc;
      opacity: 0.55;
    }

    /* 빈 주간(연속된 내용 없는 주) 기본 접기 & 통합 요약 토글 행 */
    table.update-calendar-table tr.cal-empty-week-row.is-collapsed {
      display: none;
    }

    table.update-calendar-table tr.cal-empty-weeks-toggle-row td.cal-empty-weeks-toggle-cell {
      padding: 5px 12px;
      background-color: #f8fafc;
      border: 1px solid #e2e8f0;
      text-align: center;
      cursor: pointer;
      user-select: none;
      color: #64748b;
      font-size: 0.92em;
      font-weight: 600;
      transition: background-color 0.15s ease, color 0.15s ease;
    }

    table.update-calendar-table tr.cal-empty-weeks-toggle-row:hover td.cal-empty-weeks-toggle-cell {
      background-color: #eff6ff;
      color: #1d4ed8;
    }

    .cal-empty-weeks-bar {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      line-height: 1.3;
    }

    .cal-empty-weeks-chevron {
      display: inline-block;
      font-size: 0.85em;
      transition: transform 0.2s ease;
    }

    tr.cal-empty-weeks-toggle-row.is-expanded .cal-empty-weeks-chevron {
      transform: rotate(90deg);
    }

    .cal-empty-weeks-badge {
      background-color: #e2e8f0;
      color: #334155;
      padding: 1px 7px;
      border-radius: 999px;
      font-size: 0.88em;
      font-weight: 700;
    }

    tr.cal-empty-weeks-toggle-row:hover .cal-empty-weeks-badge {
      background-color: #dbeafe;
      color: #1d4ed8;
    }

    /* 오늘 날짜 셀 하이라이트: 연한 파란색 배경 + 두꺼운 파란색 border */
    table.update-calendar-table td.cal-cell.is-today {
      background-color: #e7f5ff !important;
      border: 2.5px solid #228be6 !important;
      box-shadow: inset 0 0 0 1px #228be6;
      opacity: 1 !important;
    }

    .cal-date-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 4px;
      margin-bottom: 3px;
      line-height: 1.2;
      min-width: 0;
    }

    .cal-date-num {
      font-size: 0.95em;
      font-weight: 700;
      color: #64748b;
      flex-shrink: 0;
    }

    td.sun-cell .cal-date-num {
      color: #e03131;
    }

    td.sat-cell .cal-date-num {
      color: #1971c2;
    }

    td.holiday-cell .cal-date-num {
      color: #e03131 !important;
    }

    .cal-date-num.month-start-badge {
      background-color: #1e293b;
      color: #ffffff !important;
      padding: 1px 5px;
      border-radius: 999px;
      font-size: 0.9em;
    }

    td.sun-cell .cal-date-num.month-start-badge,
    td.holiday-cell .cal-date-num.month-start-badge {
      background-color: #e03131;
      color: #ffffff !important;
    }

    .cal-date-right {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 4px;
      min-width: 0;
      flex: 1 1 auto;
    }

    .cal-holiday-label {
      font-size: 0.85em;
      font-weight: 700;
      color: #e03131;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-width: 0;
      text-align: right;
    }

    .cal-today-badge {
      font-size: 0.85em;
      font-weight: 800;
      color: #ffffff;
      background-color: #228be6;
      padding: 1px 5px;
      border-radius: 999px;
      flex-shrink: 0;
    }

    .cal-events-wrap {
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 0;
      padding-top: 3px;
      padding-right: 3px;
    }

    /* 이벤트 RoundRect 카드: 배경색=환경(env), 글자색=검정, 우상단 border 배지=분류(type) */
    .cal-event-card {
      position: relative;
      border-radius: 7px;
      padding: 4px 10px 4px 6px;
      text-align: left;
      line-height: 1.3;
      cursor: pointer;
      min-width: 0;
      max-width: 100%;
      overflow: visible;
      box-sizing: border-box;
      border: 1px solid #cbd5e1;
      color: #0f172a;
      transition: transform 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease;
    }

    .cal-event-card:hover {
      transform: translateY(-1px);
      box-shadow: 0 3px 8px rgba(15, 23, 42, 0.12);
      filter: brightness(0.97);
    }

    /* 카드 제목: 검정색 글자, word-break 하지 않고 칸 초과 시 ... 생략 */
    .cal-event-project {
      display: block;
      max-width: 100%;
      font-weight: 800;
      font-size: var(--cal-title-font-size, 12px) !important;
      zoom: var(--cal-title-zoom, 0.7500);
      -webkit-text-size-adjust: none;
      text-size-adjust: none;
      line-height: 1.3;
      color: #0f172a !important;
      white-space: nowrap;
      word-break: normal;
      overflow: hidden;
      text-overflow: ellipsis;
      vertical-align: bottom;
    }

    .cal-event-summary {
      display: block;
      font-size: var(--cal-content-font-size, 12px) !important;
      zoom: var(--cal-content-zoom, 0.6667);
      -webkit-text-size-adjust: none;
      text-size-adjust: none;
      line-height: 1.35;
      font-weight: 500;
      color: #1e293b;
      opacity: 0.95;
      word-break: keep-all;
      overflow-wrap: break-word;
    }

    /* ==========================================
       이벤트 상세정보 팝업 모달
       ========================================== */
    .cal-modal-overlay {
      position: fixed;
      inset: 0;
      background-color: rgba(15, 23, 42, 0.55);
      backdrop-filter: blur(3px);
      -webkit-backdrop-filter: blur(3px);
      z-index: 16000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      box-sizing: border-box;
    }

    .cal-modal-overlay.active {
      display: flex;
    }

    .cal-modal-card {
      background: #ffffff;
      border-radius: 16px;
      width: min(560px, 94vw);
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 48px rgba(15, 23, 42, 0.25);
      overflow: hidden;
    }

    .cal-modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 22px;
      background: #f8fafc;
      border-bottom: 1px solid #e2e8f0;
    }

    .cal-modal-meta {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .cal-modal-env-badge {
      display: inline-flex;
      align-items: center;
      padding: 2px 8px;
      border-radius: 999px;
      border: 1px solid #cbd5e1;
      font-size: 0.78rem;
      font-weight: 700;
      color: #334155;
    }

    .cal-modal-date {
      font-size: 0.85rem;
      font-weight: 700;
      color: #475569;
      font-family: var(--font-monospace);
    }

    .cal-modal-close {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 1px solid #cbd5e1;
      background: #ffffff;
      color: #475569;
      font-size: 22px;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 0;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .cal-modal-close:hover {
      background: #fee2e2;
      border-color: #fca5a5;
      color: #dc2626;
    }

    .cal-modal-body {
      padding: 20px 22px 24px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .cal-modal-title-row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .cal-modal-title {
      font-size: 1.3rem;
      font-weight: 800;
      color: #0f172a;
      margin: 0 !important;
    }

    .cal-modal-title::before {
      display: none !important;
      content: "" !important;
    }

    .cal-modal-version {
      font-size: 0.78rem;
      font-weight: 700;
      color: #1d4ed8;
      background: #dbeafe;
      padding: 2px 9px;
      border-radius: 999px;
    }

    .cal-modal-summary {
      font-size: 1rem;
      font-weight: 700;
      color: #1e293b;
      line-height: 1.5;
    }

    .cal-modal-detail-section {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .cal-modal-detail-label {
      font-size: 0.8rem;
      font-weight: 700;
      color: #64748b;
    }

    .cal-modal-detail-box {
      font-size: 0.93rem;
      color: #334155;
      line-height: 1.65;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 12px 15px;
    }

    .cal-modal-actions {
      display: flex;
      justify-content: flex-end;
      margin-top: 4px;
    }

    .cal-modal-link-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      border-radius: 8px;
      background: #228be6;
      color: #ffffff !important;
      font-size: 0.88rem;
      font-weight: 700;
      text-decoration: none !important;
      transition: background-color 0.2s ease;
    }

    .cal-modal-link-btn:hover {
      background: #1c7ed6;
    }


    /* ==========================================
       좁은 화면(640px 이하) 점 달력
       - 칸에는 이벤트당 점 1개만 표시하고, 점을 누르면 해당 주 아래로 이벤트 1건이 펼쳐진다
       - 넓은 화면에서는 점과 펼침 행을 숨기고 기존 카드를 그대로 표시한다
       ========================================== */
    .cal-dots,
    tr.cal-day-detail-row {
      display: none;
    }

    @media screen and (max-width: 640px) {
      .cal-events-wrap {
        display: none;
      }

      table.update-calendar-table td.cal-cell {
        height: 52px;
        min-height: 52px;
        padding: 4px 2px 6px;
      }

      /* 칸이 좁아 날짜와 겹치므로 '오늘' 글자는 숨기고 칸 강조만 유지 */
      .cal-today-badge {
        display: none;
      }

      .cal-dots {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 0;
        padding-top: 2px;
      }

      /* 버튼 자체는 20px 터치 영역(49px 칸에 2개가 나란히 들어가는 크기), 보이는 점은 ::before 로 그린다 */
      .cal-dot {
        width: 20px;
        height: 20px;
        padding: 0;
        border: none;
        background: transparent;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }

      .cal-dot::before {
        content: "";
        width: 10px;
        height: 10px;
        border-radius: 50%;
        box-sizing: border-box;
        background-color: var(--cal-dot-color, #94a3b8);
        border: 1.5px solid var(--cal-dot-border, #64748b);
        transition: transform 0.15s ease, box-shadow 0.15s ease;
      }

      .cal-dot.is-active::before {
        transform: scale(1.35);
        box-shadow: 0 0 0 3px rgba(34, 139, 230, 0.35);
      }

      .cal-dot.dot-iseohyun { --cal-dot-color: #ffffff; --cal-dot-border: #64748b; }
      .cal-dot.dot-webapp { --cal-dot-color: #ff922b; --cal-dot-border: #f76707; }
      .cal-dot.dot-android { --cal-dot-color: #40c057; --cal-dot-border: #2b8a3e; }
