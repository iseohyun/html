<!DOCTYPE html>

<head>
  <meta charset="UTF-8" lang="ko">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta keywords="iseohyun">
  <meta author="iseohyun">
  <meta http-equiv="Cache-Control" content="no-cache">

  <script src="https://code.jquery.com/jquery-latest.min.js"></script>

  <script type="module">
    import { drawFlowchart } from '/modules/flowchart.js';
  </script>

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-453XSP5W9M"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());
    gtag('config', 'G-453XSP5W9M');

  <title>iseohyun.com</title>

  <!-- Google Material Symbols 아이콘 폰트 0.001초 최우선 preload (FOUT 텍스트 노출 100% 차단) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block">

  <!-- Highlight.js CDN -->
  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/base16/cupertino.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/highlight.min.js"></script>
  <script
    src="https://cdnjs.cloudflare.com/ajax/libs/highlightjs-line-numbers.js/2.8.0/highlightjs-line-numbers.min.js"></script>

  <link rel="shortcut icon" type="image/x-icon" href="/source/icon_seohyun.svg">

  <style type="text/css">
    @import url("/style.css");

    #site-history {
      width: 95%;
      margin: 0 auto 300px;
      border: 1px solid #aaa;
      padding: 1em;
      border-radius: 22px;
    }

    #site-history li {
      margin-bottom: 1em;
    }

    #site-history li::marker {
      content: "";
    }

    #site-history div {
      margin: 1px 0 5px 2em;
    }

    #site-history span.date {
      font-size: 0.8em;
      color: #999;
    }

    #site-history span.content {
      display: block;
      font-size: 0.9em;
      color: #444;
    }

    #site-history a:visited {
      color: #44c;
    }

    #site-history a:hover {
      color: red;
    }

    /* 필터 스타일 */
    .history-filters {
      width: 95%;
      margin: 20px auto 10px;
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      align-items: center;
    }

    .filter-group-wrapper {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .filter-label {
      font-size: 13px;
      font-weight: 600;
      color: #495057;
    }

    .year-btn-group,
    .tag-btn-group {
      display: inline-flex;
      border-radius: 20px;
      overflow: hidden;
      border: 1px solid #dee2e6;
    }

    .year-btn-group .filter-btn,
    .tag-btn-group .filter-btn {
      border: none;
      border-radius: 0;
      margin: 0;
      border-right: 1px solid #dee2e6;
      padding: 6px 14px;
    }

    .year-btn-group .filter-btn:last-child,
    .tag-btn-group .filter-btn:last-child {
      border-right: none;
    }

    .filter-btn {
      background-color: #f1f3f5;
      color: #495057;
      border: 1px solid #dee2e6;
      padding: 6px 12px;
      font-size: 13px;
      font-weight: 500;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .filter-btn:hover {
      background-color: #e9ecef;
    }

    .filter-btn.active {
      background-color: #228be6;
      color: white;
      border-color: #228be6;
    }

    .year-btn-group .filter-btn.active,
    .tag-btn-group .filter-btn.active {
      background-color: #228be6;
      color: white;
      border: none;
      border-right: 1px solid #228be6;
    }

    .year-btn-group .filter-btn.active:last-child,
    .tag-btn-group .filter-btn.active:last-child {
      border-right: none;
    }
  </style>
  <script src="/modules/script.js" defer></script>
</head>

<body>
  <!-- [당장 구현할 사항.md 매뉴얼 구현] 모바일 전용 상단 고정 헤더 -->
  <header class="site-header">
    <!-- 4번: 가장 왼쪽에 네비게이션을 호출하는 아이콘 -->
    <div id="header-nav-toggle" title="네비게이션 열기/닫기" style="cursor:pointer; display:flex; align-items:center; padding: 4px;">
      <span class="material-symbols-outlined" data-icon="account_tree" style="color:#2563eb; font-size:24px;"></span>
    </div>
    <!-- 5번: 현재 출력되는 문서의 title 표시 -->
    <div id="header-doc-title" style="font-weight:700; font-size:15px; color:#1e293b; letter-spacing:-0.3px; flex:1; text-align:center; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; margin: 0 10px;">
      iseohyun.com
    </div>
    <div id="headerIcons">
      <div id="header-toc-toggle" title="목차" style="cursor:pointer; display:flex; align-items:center; padding: 4px;">
        <span class="material-symbols-outlined" data-icon="toc" style="color:#475569; font-size:24px;"></span>
      </div>
    </div>
  </header>
  <article>
    <ul id="site-history"></ul>
  </article>
</body>

</html>
